<!DOCTYPE html>
<html lang="en" data-theme="dark" data-scale="l">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>FlightFabric Toolbar</title>
  <link rel="stylesheet" href="/toolbar/toolbar.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round">
            <path d="M15.2 44.3A21 21 0 0 1 45.7 16.4"/>
            <path d="M52.6 27.1A21 21 0 0 1 37.5 52.8"/>
          </g>
          <g transform="rotate(45 39 31)"><path d="M39 20.5L45.2 36.7L39 34L32.8 36.7Z" fill="currentColor"/></g>
          <path d="M10 52.5C19.6 50.9 30.3 44.9 38.9 32.8L39.9 33.6C31.6 46.1 21.6 53.4 11.4 56.1Z" fill="currentColor" opacity="0.85"/>
        </svg>
        <span class="brand-name">FlightFabric</span>
      </div>
      <div class="topbar-status">
        <span id="connection-pill" class="pill pill-muted" role="status" aria-live="polite">Connecting</span>
        <button id="settings-button" type="button" class="icon-button" aria-label="Panel settings" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8.4-3.5c0-.4 0-.8-.1-1.2l2-1.6-1.9-3.3-2.4 1a7.8 7.8 0 0 0-2.1-1.2L15.5 3h-3.8l-.4 2.7c-.8.3-1.5.7-2.1 1.2l-2.4-1L4.9 9.2l2 1.6a8.6 8.6 0 0 0 0 2.4l-2 1.6 1.9 3.3 2.4-1c.6.5 1.3.9 2.1 1.2l.4 2.7h3.8l.4-2.7c.8-.3 1.5-.7 2.1-1.2l2.4 1 1.9-3.3-2-1.6c.1-.4.1-.8.1-1.2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>

    <nav id="tabs" class="tabs" role="tablist" aria-label="Panel sections"></nav>

    <main id="content" class="content">
      <section id="tab-flight" class="tab-panel" role="tabpanel" aria-labelledby="tab-button-flight" hidden></section>
      <section id="tab-plan" class="tab-panel" role="tabpanel" aria-labelledby="tab-button-plan" hidden></section>
      <section id="tab-voice" class="tab-panel" role="tabpanel" aria-labelledby="tab-button-voice" hidden></section>
      <section id="tab-taxi" class="tab-panel" role="tabpanel" aria-labelledby="tab-button-taxi" hidden></section>
    </main>

    <div id="settings-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="sheet-scrim" data-close-settings></div>
      <div class="sheet-card">
        <div class="sheet-head">
          <h2 id="settings-title" class="sheet-title">Panel settings</h2>
          <button type="button" class="icon-button" aria-label="Close settings" data-close-settings>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="settings-body" class="sheet-body"></div>
        <div class="sheet-foot">
          <div id="settings-version" class="sheet-version"></div>
          <button id="settings-reset" type="button" class="button button-quiet">Reset to defaults</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/shared/app-settings-shared.js"></script>
  <script src="/toolbar/presets.js"></script>
  <script src="/toolbar/taxi.js"></script>
  <script src="/toolbar/toolbar.js"></script>
</body>
</html>

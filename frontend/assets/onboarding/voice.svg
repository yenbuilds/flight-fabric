  <rect x="255" y="201" width="32" height="47" rx="15" transform="rotate(-8 255 201)" fill="#1B3149"/>
  <rect x="260" y="208" width="16" height="32" rx="8" transform="rotate(-8 260 208)" fill="#526D84"/>
  <path d="M276 239C288 258 311 263 337 254" stroke="#142A3D" stroke-width="5" stroke-linecap="round"/>
  <rect x="332" y="247" width="20" height="11" rx="5.5" transform="rotate(-13 332 247)" fill="#BCEFD8"/>

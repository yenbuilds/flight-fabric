  <g filter="url(#shadow)">
    <rect x="390" y="238" width="122" height="97" rx="23" fill="#162F40"/>
    <rect x="390" y="238" width="122" height="97" rx="23" fill="url(#glass)" stroke="#89D8D0" stroke-opacity=".4"/>

<svg id="still" xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="halo"><stop stop-color="#327294" stop-opacity=".38"/><stop offset="1" stop-color="#183541" stop-opacity="0"/></radialGradient>
    <linearGradient id="shirt" x1="191" y1="272" x2="363" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#8AECCC"/><stop offset=".48" stop-color="#3DC7A7"/><stop offset="1" stop-color="#15847F"/></linearGradient>
    <linearGradient id="sleeve" x1="294" y1="318" x2="415" y2="424" gradientUnits="userSpaceOnUse"><stop stop-color="#62DBBA"/><stop offset="1" stop-color="#239893"/></linearGradient>
    <linearGradient id="resting-sleeve" x1="194" y1="298" x2="253" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#71DDBD"/><stop offset="1" stop-color="#2A9E8F"/></linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAC6A6"/><stop offset="1" stop-color="#DC8C79"/></linearGradient>
    <linearGradient id="skin" x1="275" y1="165" x2="357" y2="288" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE0C1"/><stop offset=".6" stop-color="#F4B491"/><stop offset="1" stop-color="#D17B70"/></linearGradient>
    <linearGradient id="trousers" x1="210" y1="409" x2="358" y2="521" gradientUnits="userSpaceOnUse"><stop stop-color="#5C8EED"/><stop offset="1" stop-color="#294E9A"/></linearGradient>
    <linearGradient id="hardware" x1="378" y1="230" x2="480" y2="348" gradientUnits="userSpaceOnUse"><stop stop-color="#536C89"/><stop offset="1" stop-color="#283B53"/></linearGradient>
    <linearGradient id="glass" x1="378" y1="219" x2="476" y2="335" gradientUnits="userSpaceOnUse"><stop stop-color="#B4F8E1" stop-opacity=".18"/><stop offset="1" stop-color="#B4F8E1" stop-opacity=".03"/></linearGradient>
    <linearGradient id="shoe" x1="220" y1="492" x2="308" y2="548" gradientUnits="userSpaceOnUse"><stop stop-color="#F4F7E8"/><stop offset="1" stop-color="#ADCECA"/></linearGradient>
    <filter id="shadow" x="-35%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#07111E" flood-opacity=".3"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <style>
    :root:target * { animation:none !important; }
    .voice-wave { transform-box:fill-box; transform-origin:center; animation:speak 1.2s ease-in-out 3; }
    .wave-two { animation-delay:.13s; } .wave-three { animation-delay:.26s; }
    @keyframes speak { 0%,100% { transform:scaleY(.72); opacity:.7; } 50% { transform:scaleY(1); opacity:1; } }
    @media (prefers-reduced-motion:reduce) { .voice-wave { animation:none; } }
  </style>

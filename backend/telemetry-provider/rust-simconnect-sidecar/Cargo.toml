[package]
name = "ff-rust-simconnect-sidecar"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Flight Fabric's AGPL-licensed native SimConnect bridge"
repository = "https://github.com/yenbuilds/flight-fabric"
readme = "README.md"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

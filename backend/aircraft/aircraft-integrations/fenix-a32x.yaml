    # Commands: ordered routes, guards, readbacks and evidence labels are unchanged.

    # systems
    systems.apuStart.start:
      id: systems.apuStart.start
      guard:
        groupId: fenixA32x.systems.apuStart
        cooldownMs: 3000
        retry: never
        skipWhen:
          - fieldId: systems.apuAvailable
            expectedValue: true
          - fieldId: systems.apuStart
            expectedValue: true
      routes:
        - id: fenixA32x.systems.apuStart.start.mobiflightPulse
          transport: mobiflight-calculator
          mode: pulse
          pressCode: (L:S_OH_ELEC_APU_START, Number) ++ (>L:S_OH_ELEC_APU_START, Number)
          releaseCode: (L:S_OH_ELEC_APU_START, Number) ++ (>L:S_OH_ELEC_APU_START, Number)
          delayMs: 100
          confirmation: transport-acknowledged
      verification: untested


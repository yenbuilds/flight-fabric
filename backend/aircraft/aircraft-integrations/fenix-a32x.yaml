    # baro
    baro.captain.qnhHpa:
      id: baro.captain.qnhHpa
      guard:
        groupId: fenixA32x.baro
        cooldownMs: 750
        retry: never
      input:
        type: number
        min: 948
        max: 1084
        step: 1
      verification: untested
      routes:
        - id: fenixA32x.baro.captain.qnhHpa
          stagedControl:
            sampling: decoded
            freshnessMs: 2000
            prerequisites:
              - fieldId: baro.healthy
                type: boolean
                equals: true
            targets:
              - id: captain
                observations:
                  qnh:
                    fieldId: baro.captain.qnh
                    type: boolean
                  units:
                    fieldId: flightGuidance.baroUnitCaptain
                    type: enum
                    values:
                      - hpa
                      - inhg
                  pressure:
                    fieldId: baro.captain.hpa
                    type: number
                    optional: true
                writes:
                  selectUnits: 0
                  selectMode: 1
                  decrease: 2
                  increase: 3
            input:
              min: 948
              max: 1084
              step: 1
              validation: scaled-integer
              scale: 1
            stages:
              - kind: ensure
                phase: units
                property: units
                conditions:
                  - property: units
                    equals: hpa
                write: selectUnits
                confirmation: affected
                invalidate: pressure
                freeze:
                  conditions:
                    - property: units
                      equals: hpa
                  message: Barometer units changed during the request.
              - kind: ensure
                phase: QNH mode
                property: qnh
                conditions:
                  - property: qnh
                    equals: true
                write: selectMode
                confirmation: affected
                invalidate: pressure
                freeze:
                  conditions:
                    - property: qnh
                      equals: true
                  message: Barometer mode changed during the request.
              - kind: step
                phase: pressure
                property: pressure
                conditions:
                  - property: pressure
                    input: true
                    scale: 1
                decrease: decrease
                increase: increase
                scale: 1
                min: 948
                max: 1084
                maxSteps: 403
            final:
              - property: qnh
                equals: true
              - property: units
                equals: hpa
              - property: pressure
                input: true
                scale: 1
            timing:
              readbackTimeoutMs: 2500
              pollMs: 50
              totalTimeoutMs: 25000
            errors:
              staleContext: Aircraft or simulator connection changed. No further barometer writes were sent.
              failed: Barometer control failed.
              unavailable: Fresh barometer data and a powered FCU are required.
              transportRejected: The simulator rejected the barometer control.
              writeRejected: The sidecar did not accept the barometer input.
              invalidInput: Enter a valid pressure in the selected units.
              timeout: Barometer {phase} was not confirmed. No automatic retry was sent.
              timeLimit: Barometer adjustment reached its time limit. No automatic retry was sent.
              finalChanged: Barometer changed before final confirmation.
              outOfRange: The selected pressure readback is unavailable or outside the supported range.
              missingValue: Fresh pressure data is required.
              unexpectedStep: Pressure moved by an unexpected amount. Check altimeter linking or knob acceleration.
              valueChanged: Pressure changed during the request.
          transport: mobiflight-calculator
          mode: staged-control
          baro:
            target: captain
            operation: qnhHpa
          codes:
            - 1 (>L:S_FCU_EFIS1_BARO_MODE, Number)
            - (L:S_FCU_EFIS1_BARO_STD, Number) -- (>L:S_FCU_EFIS1_BARO_STD, Number)
            - (L:E_FCU_EFIS1_BARO, Number) -- (>L:E_FCU_EFIS1_BARO, Number)
            - (L:E_FCU_EFIS1_BARO, Number) ++ (>L:E_FCU_EFIS1_BARO, Number)
          readbacks:
            - fieldId: baro.healthy
              expectedValue: true
              timeoutMs: 2500
              freshness: field
            - fieldId: baro.captain.qnh
              expectedValue: true
              timeoutMs: 2500
              freshness: field
            - fieldId: flightGuidance.baroUnitCaptain
              expectedValue: hpa
              timeoutMs: 2500
              freshness: field
            - fieldId: baro.captain.hpa
              expectedInput: true
              timeoutMs: 2500
              freshness: field

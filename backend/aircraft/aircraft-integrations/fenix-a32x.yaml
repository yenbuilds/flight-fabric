# FlightFabric aircraft definition.
# Schema version 1; preserves existing data, ordering, inheritance and verification limits.

# Mapping source notes: fenix-a32x/baro.ts
#  Exact reviewed recipes: the executor selects only these codes from fresh state.

# Mapping source notes: fenix-a32x/approach.ts
# Zero is ARMED, one is RETRACTED. Never treat zero as retract.
# Dark lamps do not establish OFF without power. Include power in the
# confirmations so neither the no-op path nor a power loss can report success.
# OFF presses the selected mode once. Retain that button's release even
# if the annunciators change during the pulse. Reject inconsistent lamps.

# Mapping source notes: fenix-a32x/actions.ts
# Fenix 2.4.0.4720 Cockpit_Behavior.xml APU + FNX32X momentary template:
# increment S_OH_ELEC_APU_START on press AND release. Reuse the bounded
# 100 ms pulse contract; this counter is not a fixed 0/1 switch or AVAIL.
# START is accepted on transport like every other family's START: the APU
# controller decides what follows, and the preset's observations on the
# START ON and AVAIL lamps (I_OH_ELEC_APU_START_L / _U, watched live on
# 2026-09-19) report starting and available honestly. A running or
# available APU makes the request a no-op.
# Fenix E_FCU_* encoders are counters: adding N moves N detents in one
# write (verified live 2026-09-18: 30 heading, 50 speed and 10 altitude
# detents each landed exactly within about half a second). Fifty per batch
# keeps any unconfirmed movement small while a 300-detent target takes a
# few seconds instead of minutes.
# Prime before sizing relative movement, then re-read the aircraft's value.
# Heading needs a real detent: live A320 2.4.0.4720 (2026-09-25) ignored an
# unchanged counter write, then initialized its heading from 0 to 161 on ++.
# The provider absorbs that initialization only here; later batches must
# still land exactly before another write is allowed.
# Pull the selector for a selected target.
# Push the selector for managed guidance.
# Two-position switches and latched buttons. These are exact assignments, not
# toggles: repeating a command is idempotent, every route has fresh logical
# readback, and no failed command retries automatically.
# Preserve both action order and collision checks while the wing-light
# descriptors move out of the shared builder into their bounded YAML group.
# Confirmed on the MASTER SW ON lamp, not on the switch input just written:
# live on 2026-09-19 the input read 1 while the lamp read 0 on an unpowered
# aircraft, and the app had reported the master as on.
# Fenix's shipped throttle interaction template uses fixed values 2-5 for the
# forward IDLE, CLB, FLX/MCT, and TOGA detents. One coordinated route moves
# both levers and does not succeed unless both independent readbacks confirm.
# Fenix momentary FCU buttons publish stable I_FCU_* outcomes but require the
# shipped S_FCU_* counter to advance once for press and once for release.
# Ordinary altitude requests select and confirm 100-foot resolution first.
# Explicit hundreds/thousands commands below retain their scale preconditions.

# Mapping source notes: fenix-a32x/wing-light-actions.yaml
# Existing Fenix A32x wing-light switch assignments; no new execution behavior.
# MobiFlight remains first. The provider selects direct LVAR only through its
# existing guarded fallback and never retries a failed dispatch through it.
# Fresh selector readback confirms the switch state, not actual lamp output.
# Evidence and variant limits remain in docs/FENIX-PROFILE-VALIDATION.md.

# Mapping source notes: fenix-a32x/fields.ts
# Logical fields are shared across the Fenix A319/A320/A321 family. Every
# active name below was reviewed against the interaction templates shipped in
# the current licensed Fenix aircraft package. Only the explicitly reviewed
# FCU momentary subset and the four fixed forward throttle detents are
# writable; unrelated momentary buttons, guarded emergency controls, circuit
# breakers, continuous axes, reverse thrust, and maintenance-only interactions
# deliberately remain outside this adapter.
# Keep the YAML field at its original catalogue position. Separate groups
# make collisions fail instead of overwriting a retained or shared field.
# APU pushbutton lamps, watched live on 2026-09-19 while the pilot pressed
# START: MASTER_L lit with MASTER SW ON, START_L lit while the APU was
# starting, START_U lit once it was available. The commanded S_ inputs
# above only echo what was written; these say what the aircraft did.
# Keep the live lever inputs numeric: physical axes can report values
# between detents, while the virtual throttle writes fixed detent values.
# Keep the extracted group in its original registration position. Build the
# remainder separately so the final merge catches collisions on either side.
# Fenix reports 0=INHG, 1=HPA and, for the altitude-scale toggle,
# 0=1000 ft, 1=100 ft. The latter ordering is explicit in the shipped
# toggle template's ANIMTIP_0/ANIMTIP_1 mapping.
# Verified live 2026-09-18 on Fenix A320 2.4.0.4720: one click at scale 1
# moved the target 1,000 ft, at scale 0 it moved 100 ft.

# Mapping source notes: fenix-a32x/wing-light-fields.yaml
# Existing Fenix A32x wing-light switch observation. This is the selector's
# numeric 0/1 state, not independent confirmation of illuminated lamp output.
# Preserve unknown values; booleans and other numeric values are unavailable.
# Evidence and variant limits remain in docs/FENIX-PROFILE-VALIDATION.md.

# Mapping source notes: fenix-a32x/fcu-fields.yaml
# Fenix selected-target observations, shared by the existing trusted A319/A320/A321
# profiles. Exact aircraft matching and authorization remain in the adapter/profile.
# Mapping evidence and variant limits: docs/FENIX-PROFILE-VALIDATION.md and the
# provenance in profiles/bundled/msfs/fenix-a32x-base.json. This extraction adds no
# live qualification; these N_/B_ outputs are readback, never encoder write inputs.
# N_FCU_VS alone does not establish units: use the independent TRACK/FPA mode.
# Strict numeric 0/1 decoding preserves unknown encodings as unavailable.
# Speed is IAS with mode 0 and Mach with mode 1; no value-based inference.
# Mode 0 selects heading/V/S; mode 1 selects track/FPA. Keep the raw target
# and mode separate so existing consumers retain their unit and command guards.

# Shared source notes:
# These helper notes retain their stated aircraft and verification scope.
#  Existing supported barometer command domains, shared by the opted-in adapters.

# Shared source notes: cockpit-lighting.ts
# These helper notes retain their stated aircraft and verification scope.
# Explicit aircraft contracts, not generic MSFS potentiometer guesses. FBW
# indices come from each aircraft's Flight Deck API. Headwind was separately
# checked against its installed A330_NEO_INTERIOR.xml. Fenix names and 0..1
# bounds come from the shipped Cockpit_Behavior.xml and knob templates.
# iniBuilds A350 1.2.6 A350_Interior.behavior.xml: knob setters clamp
# these LVARs to 0..100; display BRT buttons write 35/37/39/41 in that
# same range. The adjacent even indices control contrast, not brightness.
# See docs/COCKPIT-LIGHTING-VALIDATION.md for source and live evidence.
# Headwind 10/11 are discrete ceiling/map lamps, unlike the FBW table knobs.
# Indexed pots are read through the sidecar's A: variable reader;
# they are not part of the generic telemetry SimVar subscription.
# LIGHT_POTENTIOMETER_SET takes index first, brightness second.

# Shared source notes: transponder.ts
# These helper notes retain their stated aircraft and verification scope.
#  Opt-in only: confirm the aircraft's selected code after a BCO16 event.

schemaVersion: 1
integration:
  id: fenix-a32x
  aircraft:
    vendor: Fenix Simulations
    family: A32x
  trustedProfileKeys:
    - bundled/msfs/fenix-a319
    - bundled/msfs/fenix-a320
    - bundled/msfs/fenix-a321

# FlightFabric aircraft definition.
# Schema version 1; preserves existing data, ordering, inheritance and verification limits.

# Mapping source notes: inibuilds-a310/actions.ts
# Microsoft/iniBuilds do not publish an external write contract for the
# included A310-300. Keep the trusted page monitoring-only until every cockpit
# interaction can be paired with an independent, live-verified readback.

# Mapping source notes: inibuilds-a310/fields.ts
# No iniBuilds-published output contract with independent readback semantics is
# available. Keep the monitoring surface entirely on
# documented standard SimVars and fail unavailable when the aircraft does not
# mirror them. No aircraft-specific write is exposed.

schemaVersion: 1
integration:
  id: inibuilds-a310
  aircraft:
    vendor: Microsoft / iniBuilds
    family: Airbus A310-300
  trustedProfileKeys:
    - bundled/msfs/inibuilds-a310
  presentation:
    templateId: inibuilds-a310
  fields:

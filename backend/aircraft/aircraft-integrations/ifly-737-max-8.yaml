# FlightFabric aircraft definition.
# Schema version 1; preserves existing data, ordering, inheritance and verification limits.

# Mapping source notes: ifly-737-max-8/actions.ts
# This adapter exposes no aircraft-specific writes. Keep the dedicated page
# monitoring-only until a documented control route and independent effect
# readback have both been validated in-sim.

# Mapping source notes: ifly-737-max-8/fields.ts
# No documented iFly external variable contract is used. This adapter relies
# entirely on standard SimVars; unavailable aircraft-specific values fail closed.

schemaVersion: 1
integration:
  id: ifly-737-max-8
  aircraft:
    vendor: iFly / Flight1
    family: 737 MAX 8
  trustedProfileKeys:
    - bundled/msfs/ifly-737-max-8
  presentation:

            subscription. Generic FCU targets remain secondary confirmation only; the aircraft page displays
            native selector values.
        lights:
          source: simconnect
      controls:
        backend: simconnect
        genericFallback: false
        standardSurfaceFallback: true
        _comment: 42 guarded actions over 55 fields, 34 confirmation/guard fields, 27 standard event IDs and five
          native LVAR writes. Four FCU target actions require fresh native and independent standard target
          agreement; captain FD uses native state. These six actions are partial after independent parked MSFS
          2024 acceptance. Remaining standard controls are untested. No generic fallback, AP1/AP2,
          managed/selected push-pull, FLC, spoiler, runway-turnoff or deep-system writes.
      presentation:
        visualSupport: basic

# FlightFabric aircraft definition.
# Schema version 1; preserves existing data, ordering, inheritance and verification limits.

# Mapping source notes: microsoft-inibuilds-a32x/actions.ts
# Standard mode routes remain untested; native FD and FCU routes are below.

# Mapping source notes: microsoft-inibuilds-a32x/fcu.ts
# Native target trial and generic-event failure: AIRCRAFT-ONBOARDING-SESSION-2026-10-02.md.
# A native write echo alone cannot confirm a target: require the independently
# updated autopilot target as well. Acceptance remains variant-specific.

# Mapping source notes: microsoft-inibuilds-a32x/fields.ts
# Standard telemetry plus independently observed native FCU and captain FD
# state. The standard FD flag can disagree with the physical aircraft button.

schemaVersion: 1

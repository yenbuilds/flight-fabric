profiles:
  # Bundled profile documents retain their exact identity, inheritance and provenance.
  bundled/msfs/inibuilds-a320neo-v2:
    $schema: ../../aircraft-profile.schema.json
    version: 2
    id: inibuilds-a320neo-v2
    name: Microsoft / iniBuilds Airbus A320neo V2
    simulator: msfs
    namespace: bundled
    author: null
    authorAccount: null
    createdAt: 2026-07-19T00:00:00Z
    updatedAt: 2026-10-02T00:00:00Z
    visibility: public
    extends: bundled/msfs/airbus-base
    abstract: false
    aircraft:
      category: C
      _commentFlaps: "No aircraft-specific flap detents are configured: airbus-base intentionally does not assert
        shared Airbus flap notches. Add A320neo V2-specific detents only after vendor documentation or in-sim
        verification."
      engines:
        count: 2
        type: jet
    integration:
      aircraftSpecific:
        adapter: microsoft-inibuilds-a32x
      matching:
        priority: 94
        titleRegex: ^(?:(?:microsoft[\s_/+-]*inibuilds|microsoft|inibuilds)[\s_/-]*(?:airbus[\s_/-]*)?a320[\s_-]*neo[\s_-]*\(?v2\)?|(?:airbus[\s_/-]*)?a320[\s_-]*neo[\s_-]*\(?v2\)?[\s_/-]+(?:microsoft[\s_/+-]*inibuilds|microsoft|inibuilds))$
        titleExcludes:
          - fenix
          - flybywire
          - fbw
          - latinvfr
          - fslabs
          - fsltl
          - passiveaircraft
        configPathRegex: (?:^|[/\\])(?:fs24-)?microsoft-aircraft-a320neo(?:[/\\]|$)|(?:^|[/\\])microsoft-a320neo(?:[/\\]|$)
        configPathExcludes:
          - fenix
          - flybywire
          - fbw
          - latinvfr
          - fslabs
          - fsltl
          - passiveaircraft
          - asobo-aircraft-a320-neo
        aircraftCfg:
          _comment: The A20N designator is only accepted when both the title and creator identify the
            Microsoft/iniBuilds A320neo V2, preventing legacy Asobo, FlyByWire, and Fenix A320 variants from
            matching.
          equals:
            icao_type_designator: A20N
          containsAll:
            title:
              - Airbus A320neo V2
              - Airbus A320neo (V2)
              - Microsoft Airbus A320neo V2
              - Microsoft / iniBuilds Airbus A320neo V2
            ui_createdby: iniBuilds
      telemetry:
        preferred: simconnect
        lvars:
          _comment: The exact-profile adapter owns 11 native FCU/FD subscriptions plus one gauge A-var voltage
            subscription. Generic FCU targets remain secondary confirmation only; the aircraft page displays
            native selector values.
        lights:
          source: simconnect
      controls:
        backend: simconnect
        genericFallback: false
        standardSurfaceFallback: true
        _comment: 42 guarded actions over 55 fields, 34 confirmation/guard fields, 27 standard event IDs and five
          native LVAR writes. Four FCU target actions require fresh native and independent standard target
          agreement; captain FD uses native state. These six actions are partial after independent parked MSFS
          2024 acceptance. Remaining standard controls are untested. No generic fallback, AP1/AP2,
          managed/selected push-pull, FLC, spoiler, runway-turnoff or deep-system writes.
      presentation:
        visualSupport: basic
        lights:
          available:
            - beacon
            - nav
            - strobe
            - landing
            - taxi
            - turnoff
            - logo
            - wing
          labels:
            beacon: BCN
            nav: NAV
            strobe: STRB
            landing: LND
            taxi: TAXI
            turnoff: RWY
            logo: LOGO
            wing: WING
    meta:
      developer: Microsoft / iniBuilds
      platforms:
        - msfs2020
        - msfs2024
      updated: 2026-10-02
      status: experimental
      notes: "Microsoft / iniBuilds Airbus A320neo V2: 55 fields, 42 actions, 34 confirmation/guard fields and 12
        gauge subscriptions. Four native FCU targets and captain FD were independently checked in this exact
        aircraft on MSFS 2024 1.8.16.0, powered and parked. Other controls and flight behavior remain
        unvalidated. See docs/AIRCRAFT-ONBOARDING-SESSION-2026-10-02.md."
    provenance:
      sources:
        - type: official-docs
          name: Microsoft Flight Simulator 2024 FAQ - aircraft matrix
          url: https://flightsimulator.zendesk.com/hc/en-us/articles/12702272798364-Microsoft-Flight-Simulator-2024-FAQ
          retrievedAt: 2026-07-19
          notes: Lists the Airbus A320neo and confirms it is included with Microsoft Flight Simulator 2024 Standard,
            Deluxe, Premium Deluxe, and Aviator editions.
        - type: official-docs
          name: Microsoft Flight Simulator - May 23, 2024 Development Update
          url: https://www.flightsimulator.com/may-23rd-2024-development-update/
          retrievedAt: 2026-07-19
          notes: Identifies the A320neo V2 as part of Sim Update 15 and the free Marketplace aircraft as Airbus A320neo
            Enhanced by Microsoft/iniBuilds.
        - type: official-docs
          name: Microsoft Flight Simulator - Aircraft Manuals
          url: https://www.flightsimulator.com/aircraft-manuals/
          retrievedAt: 2026-07-19
          notes: Lists the Airbus A320neo V2 manual as Version 1 from iniBuilds, supporting the canonical model and
            developer identity. The page does not publish an external telemetry/control variable map.
        - type: forum
          name: iniBuilds Support - How to clear the WASM folder (A320neo)
          url: https://forum.inibuilds.com/topic/24256-how-to-clear-the-wasm-folder/
          retrievedAt: 2026-07-19
          notes: Official iniBuilds support instructions identify the MSFS 2024 package as microsoft-aircraft-a320neo.
        - type: official-sdk
          name: MSFS 2024 Avionics Framework - SimVars
          url: https://microsoft.github.io/msfs-avionics-mirror/2024/docs/interacting-with-msfs/simvars/
          retrievedAt: 2026-08-13
          notes: Documents standard SimVars. Native target and captain FD mappings additionally use recorded,
            variant-specific simulator verification below; this page does not document those native names.
        - type: official-sdk
          name: MSFS 2024 Avionics Framework - Key Events
          url: https://microsoft.github.io/msfs-avionics-mirror/2024/docs/interacting-with-msfs/key-events/
          retrievedAt: 2026-08-13
          notes: Documents the simulator key-event transport used by this exact-profile adapter. The active event IDs
            and parameters are enumerated by the generation- and category-specific Microsoft SDK sources
            below.
        - type: official-sdk
          authority: simulator-vendor
          access: public
          supportsActiveMappings: true
          name: MSFS 2020 SDK - Aircraft Autopilot and Flight Assist Events
          url: https://docs.flightsimulator.com/html/Programming_Tools/Event_IDs/Aircraft_Autopilot_Flight_Assist_Events.htm
          retrievedAt: 2026-08-13
          notes: "MSFS 2020 source for the remaining standard flight-guidance events: AUTOPILOT_OFF, AUTOPILOT_ON,
            AUTO_THROTTLE_ARM, AP_AIRSPEED_OFF, AP_AIRSPEED_ON, AP_HDG_HOLD_OFF, AP_HDG_HOLD_ON,
            AP_ALT_HOLD_OFF, AP_ALT_HOLD_ON, AP_VS_OFF, AP_VS_ON, AP_NAV1_HOLD_OFF, AP_NAV1_HOLD_ON,
            AP_APR_HOLD_OFF, AP_APR_HOLD_ON. Toggle events serve guarded OFF/ON logical intents only after
            fresh readback. These are generic simulator semantics, not an A320neo V2 AP1/AP2 or Airbus
            managed/selected contract."
        - type: official-sdk
          authority: simulator-vendor
          access: public

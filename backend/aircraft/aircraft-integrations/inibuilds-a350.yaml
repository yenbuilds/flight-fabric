# FlightFabric aircraft definition.
# Schema version 1; preserves existing data, ordering, inheritance and verification limits.

# Mapping source notes: inibuilds-a350/nd-range.ts
# Installed A350 1.2.6 cockpit behavior and HubHop use MAP_RANGE;
# the older vendor PDF says MAP_MODE_RANGE. Both sides passed parked readback
# checks on the -900; see docs/A350-PROFILE-VALIDATION.md for scope and limits.
# The selector has twelve positions. Only the seven normal
# navigation detents are exposed; airport zoom and mode-dependent scale are not.

# Mapping source notes: inibuilds-a350/fields.ts
# iniBuilds publishes these exact A350 variables for external hardware and
# software. Raw names and selector detents remain private to this family
# adapter; standard surface state is explicitly named below.

# Shared presentation: ../aircraft-command-catalogue.ts
# These helper notes retain their stated aircraft and verification scope.
# Explicit aircraft contracts, not generic MSFS potentiometer guesses. FBW
# indices come from each aircraft's Flight Deck API. Headwind was separately
# checked against its installed A330_NEO_INTERIOR.xml. Fenix names and 0..1
# bounds come from the shipped Cockpit_Behavior.xml and knob templates.
# iniBuilds A350 1.2.6 A350_Interior.behavior.xml: knob setters clamp
# these LVARs to 0..100; display BRT buttons write 35/37/39/41 in that
# same range. The adjacent even indices control contrast, not brightness.
# See docs/COCKPIT-LIGHTING-VALIDATION.md for source and live evidence.
# Headwind 10/11 are discrete ceiling/map lamps, unlike the FBW table knobs.
# Indexed pots are read through the sidecar's A: variable reader;
# they are not part of the generic telemetry SimVar subscription.
# LIGHT_POTENTIOMETER_SET takes index first, brightness second.

# Shared source notes: apu-start.ts
# These helper notes retain their stated aircraft and verification scope.
#  FBW's installed aircraft_preset_procedures.xml uses 3000 ms after master ON.
#  Only for vendor-documented fixed START=1 controls (not Fenix counters).

schemaVersion: 1
integration:
  id: inibuilds-a350
  aircraft:
    vendor: iniBuilds
    family: A350
  trustedProfileKeys:
    - bundled/msfs/inibuilds-a350-900
    - bundled/msfs/inibuilds-a350-1000
  presentation:
    templateId: inibuilds-a350
    cockpitLightingGroups:
      - actionId: lighting.preset.panels.set
        label: Panel backlighting
        fields:
          - lighting.integralPercent
          - lighting.fcuPercent
          - lighting.fcuTextPercent
      - actionId: lighting.preset.flood.set
        label: Flood and dome lighting
        fields:
          - lighting.mainFloodPercent
          - lighting.domePercent
      - actionId: lighting.preset.captainTask.set
        label: Captain map, table and console lights
        fields:
          - lighting.captainMapPercent
          - lighting.captainTablePercent
          - lighting.captainConsolePercent
      - actionId: lighting.preset.firstOfficerTask.set
        label: First officer map, table and console lights
        fields:
          - lighting.firstOfficerMapPercent
          - lighting.firstOfficerTablePercent
          - lighting.firstOfficerConsolePercent
      - actionId: lighting.preset.displays.set
        label: Flight displays
        displays: true
        fields:
          - lighting.captainDisplayPercent
          - lighting.firstOfficerDisplayPercent
          - lighting.mfdDisplayPercent
          - lighting.systemDisplayPercent

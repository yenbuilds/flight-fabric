    provenance:
      sources:
        - type: community
          authority: community
          access: public
          supportsActiveMappings: false
          name: Original HubHop A350 ND range mappings
          url: https://hubhop.mobiflight.com/preset/?id=c73915cb-73f3-48a7-a444-f745a8c472fc
          retrievedAt: 2026-09-07
          notes: HubHop presets map INI_MAP_RANGE_CAPT_SWITCH and INI_MAP_RANGE_FO_SWITCH positions 5..11 to the normal
            10..640 NM range detents. This differs from INI_MAP_MODE_RANGE_* in the official LVar PDF. The
            adapter uses the original integration spelling with same-field confirmation, never writes both
            names, and leaves airport zoom selection unavailable. Installed MSFS 2024 A350 1.2.6 cockpit
            behavior confirms the MAP_RANGE names and 0-11 detents. On 2026-09-25 the -900 passed same-field
            10-20-10 range checks on both sides; displayed scale and -1000 live acceptance remain pending. See
            docs/A350-PROFILE-VALIDATION.md. See docs/ATC-EFIS-AIRCRAFT-COVERAGE.md.
        - type: official-sdk
          authority: aircraft-vendor
          access: public
          supportsActiveMappings: true
          name: iniBuilds A350 Airliner LVAR List (A350 LVARs-FEB2025.pdf)
          url: https://forum.inibuilds.com/topic/25015-key-lvars-list-a350/
          retrievedAt: 2026-09-02
          notes: Covers the published INI_* state variables, selector detents and direct FCU set/read variables used by
            the shared A350 adapter. iniBuilds explicitly documents third-party read/write use.
        - type: official-sdk
          authority: simulator-vendor
          access: public
          supportsActiveMappings: true
          name: Microsoft Flight Simulator 2024 SDK aircraft events
          url: https://docs.flightsimulator.com/msfs2024/html/6_Programming_APIs/Key_Events/Key_Events.htm
          retrievedAt: 2026-09-02
          notes: Covers the adapter's GEAR_UP, GEAR_DOWN, FLAPS_INCR, FLAPS_DECR, PARKING_BRAKE_SET, SPOILERS_ARM_OFF,
            SPOILERS_ARM_ON and SPOILERS_SET standard surface routes.
        - type: official-docs
          authority: aircraft-vendor
          access: public
          supportsActiveMappings: false
          name: iniBuilds A350 Airliner for MSFS product page
          url: https://inibuilds.com/products/inibuilds-a350-airliner-msfs-2024
          retrievedAt: 2026-09-02
          notes: Product and platform identity for the A350-900 package variant. Active mappings are inherited from the
            source-backed family profile.
        - type: official-docs
          authority: regulator
          access: public
          supportsActiveMappings: false
          name: UK CAA TCDS UK.TC.A.00157 - Airbus A350
          url: https://www.caa.co.uk/Documents/Download/3934/ca692457-336e-4190-840e-cd26cf498935/3888
          retrievedAt: 2026-06-03
          notes: Documents A350-900 variant identity and certified weight context.
        - type: official-sdk
          authority: aircraft-vendor
          access: vendor-install
          supportsActiveMappings: true
          name: iniBuilds A350 1.2.6 flap lever and landing autobrake behavior
          url: https://forum.inibuilds.com/topic/25015-key-lvars-list-a350/
          retrievedAt: 2026-10-17
          notes: Installed Function_Interior_A350/model/A350_Interior.behavior.xml SHA256
            886c885ce5ee2480740fafed75c5d38fcca6d4cc8bd77b9b391556b58744b2fb. The cockpit wheel calls
            AIRLINER_Flaps_Inc / AIRLINER_Flaps_Dec with 16384 divided by FLAPS NUM HANDLE POSITIONS; these
            invoke AIRLINER_FLAPS and INI.FLAPS_SET. FlightFabric follows that wheel sequence, independently
            confirming each 25-percent FLAPS HANDLE PERCENT detent, at most four steps. Direct target jumps
            left the A350-1000 at FULL after selecting 1; the stepped FULL-to-1 route restored cockpit 1+F on
            2026-10-17. AIRLINER_LDG_AUTO_BRK triggers INI_AUTOBRAKE_ARMED_CMD; independent
            INI_AUTOBRAKE_ARMED confirms arm/disarm with fresh same-target no-op protection. Manual 1.5 pages
            65-67 requires runway/exit setup for BTV. -1000 lever, autobrake and restoration checks passed;
            -900, airborne transitions and actual landing braking remain pending. See
            docs/A350-PROFILE-VALIDATION.md.
      verification:
        status: partial
        lastVerified: 2026-09-25
        knownIssues:

  actions:
    # Commands: ordered routes, guards, readbacks and evidence labels are unchanged.

    # flightGuidance
    flightGuidance.speed.set:
      id: flightGuidance.speed.set
      input:
        type: number
        min: 100
        max: 399
        step: 1
      guard:
        cooldownMs: 300
        groupId: iniA350.flightGuidance.speed
        retry: never
      routes:
        - id: iniA350.flightGuidance.speed.set.simconnectSequence
          transport: simconnect-sequence
          operations:
            - type: lvar
              name: L:INI_AIRSPEED_DIAL
              unit: Number
              inputValue:
                source: input
          readback:
            fieldId: flightGuidance.speedValue
            expectedInput: true
            timeoutMs: 3000
      verification: untested
    flightGuidance.heading.set:
      id: flightGuidance.heading.set

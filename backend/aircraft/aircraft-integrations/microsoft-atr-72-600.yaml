# FlightFabric aircraft definition.
# Schema version 1; preserves existing data, ordering, inheritance and verification limits.

# Mapping source notes: microsoft-atr-72-600/actions.ts
# ATR-specific control variables lack a Microsoft/S&H contract and verified
# system-effect readbacks. No aircraft-specific write is exposed.

# Mapping source notes: microsoft-atr-72-600/fields.ts
# Microsoft/S&H do not publish an external MSATR_* variable contract for this
# aircraft. Keep the adapter entirely on documented standard MSFS SimVars and
# fail unavailable if the ATR does not mirror a given state.

schemaVersion: 1
integration:
  id: microsoft-atr-72-600
  aircraft:
    vendor: Microsoft / S&H Software
    family: ATR 72-600
  trustedProfileKeys:
    - bundled/msfs/microsoft-atr-72-600
  presentation:

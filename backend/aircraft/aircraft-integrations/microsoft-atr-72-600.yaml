    # Commands: ordered routes, guards, readbacks and evidence labels are unchanged.
    {}
  catalogue:
    order: 13
    legacyExports:
      MICROSOFT_ATR_72_600_ADAPTER_ID:
        kind: id
        order: 36
      MICROSOFT_ATR_72_600_INTEGRATION:

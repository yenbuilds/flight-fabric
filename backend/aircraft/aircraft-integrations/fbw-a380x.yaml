      verification:
        status: partial
        lastVerified: 2026-08-15
        testedTitles: []
        knownIssues:
          - Gear limits are estimated pending a reviewable vendor or manufacturer source.
          - Flap handle value mapping (0-4 lever indices) not confirmed in MSFS
          - The profile relies on the FLAPS HANDLE INDEX path; its five detent positions still need in-sim
            verification.
          - All 46 write actions remain untested in the live aircraft. A documented standard simulator event
            can still be ignored or incompletely mirrored by a complex aircraft.
          - The four forward-throttle actions use every lever's saved FlyPad calibration-window midpoint
            through one MobiFlight calculator expression, then require newer exact A32NX_AUTOTHRUST_TLA:1
            through :4 confirmation. Missing or malformed bounds prevent all four axis writes. Reverse thrust
            and arbitrary raw-axis targets remain excluded.
          - A32NX.FCU_AP_1_PUSH is a direct AP1 toggle. OFF/ON intents require fresh A32NX_AUTOPILOT_1_ACTIVE
            readback before dispatch and a newer matching result afterward; AP2 remains read-only.
          - Exterior-light readback confirms lamp output, not Airbus AUTO or selector-detent position. Only
            explicit OFF and ON output targets are exposed.
          - Managed/selected push-pull, runway-turnoff writes, engines, QNH entry, guarded/emergency controls
            and deep systems remain excluded.
          - Start APU UI and voice preset is source-backed and covered by automated transport tests; live
            start, electrical prerequisites, selector release and aircraft variant/build coverage remain
            untested. See docs/APU-START-VALIDATION.md.
      dataQuality:
        flaps: documented
        gear: estimated
        spoilers: unknown
        lights: unknown

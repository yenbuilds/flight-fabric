  actions:
    # Commands: ordered routes, guards, readbacks and evidence labels are unchanged.

    # baro
    # A380X Flight Deck API and vendor FlyByWireInterface::updateEfisSync:
    # PUSH selects STD; PULL returns to local pressure. The A320 is the reverse.
    # CP_ACTIVE and DISPLAY_BARO_IS_STD belong to each independent EFIS panel.
    baro.captain.std:
      id: baro.captain.std
      verification: untested
      guard:
        groupId: fbwA380x.baro
        cooldownMs: 750
        retry: never
      routes:
        - id: fbwA380x.baro.captain.std
          transport: simconnect-sequence
          baro:
            target: captain
            operation: std
          conditionalWrites:
            freshnessMs: 2000
            targets:
              - id: captain
                operationIndex: 0
                prerequisiteFieldIds:
                  - baro.captain.active
                readbackFieldId: baro.captain.std
          operations:
            - type: event
              name: A32NX.FCU_EFIS_L_BARO_PUSH
              value: 0
          readbacks:
            - fieldId: baro.captain.active
              expectedValue: true
              timeoutMs: 2500
              freshness: field
            - fieldId: baro.captain.std
              expectedValue: true
              timeoutMs: 2500
              freshness: field
    baro.firstOfficer.std:
      id: baro.firstOfficer.std
      verification: untested
      guard:
        groupId: fbwA380x.baro
        cooldownMs: 750
        retry: never
      routes:
        - id: fbwA380x.baro.firstOfficer.std

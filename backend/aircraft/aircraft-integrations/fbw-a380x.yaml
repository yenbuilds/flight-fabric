profiles:
  # Bundled profile documents retain their exact identity, inheritance and provenance.
  bundled/msfs/fbw-a380x:
    $schema: ../../aircraft-profile.schema.json
    version: 2
    id: fbw-a380x
    name: FlyByWire A380X
    simulator: msfs
    namespace: bundled
    author: null
    authorAccount: null
    createdAt: 2026-05-15T00:00:00Z
    updatedAt: 2026-08-15T00:00:00Z
    visibility: public
    extends: bundled/msfs/airbus-base
    abstract: false
    aircraft:
      category: D
      flaps:
        _comment: "A380 has five lever positions: 0, 1, 2, 3, FULL. Config 1+F extends automatically from Config 1 at
          low speed; there is no dedicated lever notch. Speed values are based on public FlyByWire material
          and remain pending in-sim verification."
        notches:
          - value: 0
            label: "0"
          - value: 1
            label: "1"
          - value: 2
            label: "2"
          - value: 3
            label: "3"
          - value: 4
            label: FULL
        landingNotches:
          - 3
          - 4
      stability:
        speedBand:
          belowVrefKts: 5
          aboveVrefKts: 15
        vsLimits:
          downFpm: 1000
          upFpm: 200
        thrustMinPct: 20
        pitch:
          minDeg: -3
          maxDeg: 10
        stabilizedGates:
          imcRaFt: 1000
          vmcRaFt: 500
      landing:
        grades:
          perfectMinFpm: -100
          goodMinFpm: -200
          firmMinFpm: -350
          hardMinFpm: -500
          _comment: Provisional A380 landing-rate bands pending aircraft-specific source verification.
      throttle:
        type: detent
      engines:
        count: 4
        type: jet
    integration:
      aircraftSpecific:
        adapter: fbw-a380x
      matching:
        priority: 90
        titleRegex: ^(?:flybywire|fbw)[\s_/-]*(?:airbus[\s_/-]*)?a380(?:x|[\s_-]*842)(?:[\s_/-]*\([\s_-]*a380[\s_-]*842(?:r[\s_-]*rr)?[\s_-]*\))?(?:[\s_/-]+no[\s_-]*cabin)?$
        titleExcludes:
          - headwind
          - inibuilds
          - fenix
          - latinvfr
          - fsltl
          - passiveaircraft
        configPathContains:
          - flybywire-aircraft-a380-842
          - flybywire-aircraft-a380x
          - fbw-a380x
        configPathRegex: (?:^|[/\\])(?:flybywire-aircraft-a380(?:-842|x)|fbw-a380x|flybywire_a380(?:x|_842(?:_no_?cabin)?))(?:[/\\]|$)
        configPathExcludes:
          - headwind
          - inibuilds
          - fenix
          - latinvfr
          - fsltl
          - passiveaircraft
      telemetry:
        preferred: simconnect
        lvars:
          _comment: A32NX_AUTOPILOT_1_ACTIVE, A32NX_AUTOTHRUST_STATUS, A32NX_FLAPS_HANDLE_INDEX,
            A32NX_PARK_BRAKE_LEVER_POS, A32NX_SPOILERS_ARMED, A32NX_SPOILERS_HANDLE_POSITION, and the FCU
            selected-value LVARs below are documented for the A380X in the FlyByWire A380X Flight Deck API.
            The A32NX_ prefix is expected on this aircraft.
          autopilot: A32NX_AUTOPILOT_1_ACTIVE
          autothrottle: A32NX_AUTOTHRUST_STATUS
          flaps: A32NX_FLAPS_HANDLE_INDEX
          _commentFlaps: A32NX_FLAPS_HANDLE_INDEX is documented for A380X as a read-only custom LVAR with 0=UP and
            4=FULL. FlightFabric uses profile flap LVARs before SimConnect flap mapping.
          spoilers:
            _comment: The cited FlyByWire interface supplies the intended armed state through A32NX_SPOILERS_ARMED and a
              0-1 handle fraction through A32NX_SPOILERS_HANDLE_POSITION; the standard SimConnect armed field
              is not used for this profile.
            armed: A32NX_SPOILERS_ARMED
            handlePosition: A32NX_SPOILERS_HANDLE_POSITION
          parkingBrake: A32NX_PARK_BRAKE_LEVER_POS
          _commentParkingBrake: The cited FlyByWire interface supplies the intended parking-brake lever state through
            A32NX_PARK_BRAKE_LEVER_POS (0=released, 1=set); the standard SimConnect field is not used for this
            profile.
          mcp:
            _comment: A380X documents selected speed, heading, and V/S as custom FCU LVAR readbacks. Selected altitude is
              documented as AUTOPILOT ALTITUDE LOCK VAR:3, so FlightFabric keeps altitude on the existing
              SimConnect target path.
            speed: A32NX_AUTOPILOT_SPEED_SELECTED
            heading: A32NX_AUTOPILOT_HEADING_SELECTED
            vs: A32NX_AUTOPILOT_VS_SELECTED
            loc: A32NX_FCU_LOC_MODE_ACTIVE
            app: A32NX_FCU_APPR_MODE_ACTIVE
        lights: {}
      controls:
        backend: simconnect
        genericFallback: false
        standardSurfaceFallback: true
        _comment: The exact-profile trusted adapter exposes 46 guarded actions, including six FCU numeric targets,
          four calibrated forward-throttle detents, exterior lights, gear, flaps, spoilers, parking brake, APU
          and three side-targeted STD commands. Each STD command selects the real A380 STD mode and confirms
          each selected active EFIS panel independently. QNH entry, managed/selected push-pull, reverse
          thrust, arbitrary axes and deep systems remain excluded.
      presentation:
        visualSupport: basic
        lights:
          available:
            - beacon
            - nav
            - strobe
            - landing
            - taxi
            - turnoff
            - logo
            - wing
          labels:
            beacon: BCN
            nav: NAV
            strobe: STRB
            landing: LND
            taxi: TAXI
            turnoff: RWY
            logo: LOGO
            wing: WING

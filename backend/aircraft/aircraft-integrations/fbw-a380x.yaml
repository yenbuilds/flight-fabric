          baro:
            target: firstOfficer
            operation: std
          conditionalWrites:
            freshnessMs: 2000
            targets:
              - id: firstOfficer
                operationIndex: 0
                prerequisiteFieldIds:
                  - baro.firstOfficer.active
                readbackFieldId: baro.firstOfficer.std
          operations:
            - type: event
              name: A32NX.FCU_EFIS_R_BARO_PUSH
              value: 0
          readbacks:
            - fieldId: baro.firstOfficer.active
              expectedValue: true
              timeoutMs: 2500
              freshness: field
            - fieldId: baro.firstOfficer.std
              expectedValue: true
              timeoutMs: 2500
              freshness: field
    baro.both.std:
      id: baro.both.std
      verification: untested
      guard:
        groupId: fbwA380x.baro
        cooldownMs: 750
        retry: never
      routes:
        - id: fbwA380x.baro.both.std
          transport: simconnect-sequence
          baro:
            target: both
            operation: std
          # Each active EFIS panel selects STD only when needed. Confirm its
          # newer STD observation; a transport acknowledgement is not readback.
          conditionalWrites:
            freshnessMs: 2000
            targets:
              - id: captain
                operationIndex: 0
                prerequisiteFieldIds:
                  - baro.captain.active
                readbackFieldId: baro.captain.std
              - id: firstOfficer
                operationIndex: 1
                prerequisiteFieldIds:
                  - baro.firstOfficer.active
                readbackFieldId: baro.firstOfficer.std
          operations:
            - type: event
              name: A32NX.FCU_EFIS_L_BARO_PUSH
              value: 0
            - type: event
              name: A32NX.FCU_EFIS_R_BARO_PUSH
              value: 0
          readbacks:
            - fieldId: baro.captain.active
              expectedValue: true
              timeoutMs: 2500
              freshness: field
            - fieldId: baro.captain.std
              expectedValue: true
              timeoutMs: 2500
              freshness: field
            - fieldId: baro.firstOfficer.active
              expectedValue: true
              timeoutMs: 2500
              freshness: field
            - fieldId: baro.firstOfficer.std
              expectedValue: true
              timeoutMs: 2500
              freshness: field


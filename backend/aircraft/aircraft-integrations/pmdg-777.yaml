# FlightFabric aircraft definition.
# Schema version 1; preserves existing data, ordering, inheritance and verification limits.

# Mapping source notes: pmdg-777/actions.ts
# Installed 777-300ER 2.4.146 cockpit behavior: control 3, press=1/2 by click
# half, wheel up=7, wheel down=8, release=4. The XML does not name which click
# half advances; community presets against L:switch_03_a (0 OFF, 50 ON,
# 100 START) show 307 advances toward START and 308 retreats, so use the
# wheel action. Allow each advance to settle, then release once at START.
# The SDK's ELEC_APU_Selector=2 is telemetry, not evidence of a START interaction.
# PMDG's documented direct MCP events accept logical cockpit values after the
# event-specific wire transforms declared in PMDG_777X_SDK.h.
# The installed PMDG sample operates FD switches with a complete mouse click.
# Reading the current switch first keeps logical ON/OFF requests idempotent.
# The remainder of this catalog is restricted to persistent cockpit controls
# that have a matching PMDG ClientData readback. Two-state controls use one
# complete mouse click only when the requested state differs from fresh
# readback, avoiding unverified per-control numeric position polarity.
# Guarded emergency/maintenance controls, spring-loaded controls without an
# outcome readback, doors, trim, thrust axes, fire controls, oxygen deployment,
# IDG disconnects, RAT, and fuel jettison stay excluded.
# Stable OFF/ON positions retain readback; START acknowledges dispatch.
# External-power pushbuttons are momentary controls. Their persistent ON
# annunciators provide the requested-state readback needed to make logical
# ON/OFF requests deterministic.
# The numeric #69927 DOWN payload was accepted without moving the lever live.
# Standard events moved both ways; retain exact SDK lever confirmation without
# waiting for physical gear travel. See docs/PMDG-777-GEAR-VALIDATION.md.
# PMDG publishes dedicated mouse events for every flap and speedbrake target.
# Use the sample's complete press/release sequence; zero is not a mouse action.
# RESET is spring-loaded back to HOLD and therefore has no stable target.
# PMDG 777-300ER 2.4.146 77W_Cockpit_Behavior.xml writes these knob LVARs directly,
# clamped to 0..100. The SDK's 0..100 data members are readbacks, not proof that
# the similarly named events accept percentage payloads (the dome event did not).
# Keep matching SDK connectivity and independent SDK confirmation for each write.
# Absolute dimmers can follow a confirmed preset immediately; in-flight and
# whole-preset locks still prevent overlap.

# Shared source notes: pmdg-atc.ts
# These helper notes retain their stated aircraft and verification scope.
#  Shared simulator transponder state; PMDG's SDK does not publish the code.
# The SDK exposes a button, not the duration of the transmitted IDENT.


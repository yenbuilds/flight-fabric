  behavior:
    readbackFailureHints:
      - actionPrefix: controls.parkingBrake.
        text: " PMDG Realistic parking-brake mode can require both toe brakes to be held before the lever accepts SET; releasing may be controlled by pedal input."
    flightGuidanceProjection:
      id: pmdg-777.flight-guidance
      version: 1
      eventType: flight_guidance_event
      lane: flight-guidance
      source: sdk
      profileLeaves:
        - pmdg-777
        - pmdg-777-200er
        - pmdg-777-200lr
        - pmdg-777f
      modeSettleMs: 500
      targetSettleMs: 1500
      maxEvents: 2000
      maxCoverageIntervals: 2048
      dedupeWindowMs: 2500
      lateralModes:
        - LNAV
        - HDG HOLD
        - TRK HOLD
        - LOC
        - APP
      verticalModes:
        - VNAV
        - FLCH
        - V/S
        - FPA
        - ALT HOLD
        - APP
      automationModeAliases:
        HDG: HDG HOLD
        LVL_CHG: FLCH
        VS: V/S
        ALT: ALT HOLD
      fields:
        apEngaged: flightGuidance.apEngaged
        athrArmed: flightGuidance.autothrottleArmed
        lnav: flightGuidance.lnav
        vnav: flightGuidance.vnav
        flch: flightGuidance.flch
        headingHold: flightGuidance.headingHold
        verticalSpeed: flightGuidance.verticalSpeed
        altitudeHold: flightGuidance.altitudeHold
        localizer: flightGuidance.localizer
        approach: flightGuidance.approach
        speedKts: flightGuidance.speedKts
        mach: flightGuidance.mach
        headingDeg: flightGuidance.headingDeg
        altitudeFt: flightGuidance.altitudeFt
        vsFpm: flightGuidance.vsFpm
        fpaDeg: flightGuidance.fpaDeg
        headingMode: flightGuidance.headingMode
        verticalMode: flightGuidance.verticalMode
      booleanModes:
        - fieldId: flightGuidance.lnav
          label: LNAV
        - fieldId: flightGuidance.vnav
          label: VNAV
        - fieldId: flightGuidance.flch
          label: FLCH
        - fieldId: flightGuidance.headingHold
          label: HDG/TRK HOLD
        - fieldId: flightGuidance.verticalSpeed
          label: V/S/FPA
        - fieldId: flightGuidance.altitudeHold

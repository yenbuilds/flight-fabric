          retrievedAt: 2026-09-07
          notes: Documents XPNDR_SET for the PMDG 777 code. Corroborates the simulator event contract; FlightFabric
            requires its own post-write code confirmation. No source code is copied.
        - type: official-sdk
          authority: aircraft-vendor
          access: vendor-install
          supportsActiveMappings: true
          name: PMDG 777 MSFS SDK manual and installed sample
          url: https://manuals.pmdg.com/777/introduction/index.html
          retrievedAt: 2026-09-06
          notes: "The installed PMDG 777-300ER 2.4.141 SDK manual, header, and connection sample define the 684-byte
            read-only ClientData contract, direct-position control events and data-broadcast requirement. The
            audited header SHA-256 is 3D0ECFB39FE7524A5017B63C7CB52F4D850B97F738ED5D4D8F1637AFC1A676F7.
            FlightFabric's checked-in pmdg-777x-clientdata connector is loaded through the declarative
            clientdata-manifest adapter; the public source includes FlightFabric's independently written SDK
            interoperability mappings but not PMDG headers, manuals, samples, binaries, or other vendor files.
            APU START interaction reviewed 2026-09-10 after the related 737 report, installed PMDG 777-300ER
            2.4.146: 77W_Cockpit_Behavior.xml component switch_03_a defines control 3 with press action 1 or 2
            chosen by mouse click half, wheel up action 7, wheel down action 8 and release action 4. Direction
            correction 2026-09-17: the XML does not name which click half advances; locally installed
            community presets stepping L:switch_03_a (0 OFF, 50 ON, 100 START) show 307 advances toward START
            and 308 retreats, so START now uses the direction-explicit wheel action. Timing correction
            2026-09-14: START sends ROTOR_BRAKE 307, pauses 500 ms, sends 307, pauses 500 ms, then sends 304.
            These bounded interaction pauses allow the switch to reach START before release; they are not an
            APU availability wait. This replaces the unverified direct SDK event 69635 payload 2;
            ELEC_APU_Selector OFF=0, ON=1, START=2 describes telemetry. The sequence retains matching SDK
            connectivity, exact-profile routing, cooldown and no retry, and acknowledges only after all three
            interactions are accepted. APURunning remains independent observation and suppresses a new START
            when fresh. No spool-up delay is added. A live 777 failure has not been confirmed; live retesting
            is pending. See docs/APU-START-VALIDATION.md. ATC/EFIS review 2026-09-07: installed SDK/header and
            cockpit XML define EFIS_RangeSel, EFIS_MinsSelBARO and the IDENT mouse interaction through
            ROTOR_BRAKE (press switch*100+1, release switch*100+4). 777 switch 746, EFIS_BaroMinimumsSet at
            513/514, signed EFIS_BaroMinimums at 516/520, EFIS_RadioMinimumsSet at 524/525 and signed
            EFIS_RadioMinimums at 528/532 in the 684-byte native layout. Approach-control review 2026-09-07
            against installed PMDG_777X_SDK.h (2.4.146): DOWN/UP/50PCT speedbrake targets use events
            74613/74615/74616, one left press/release and existing FCTL_Speedbrake_Lever confirmation at
            0/100/75. The HALF readback was corrected on 2026-10-17 using independent live SDK
            observation on the 777-300ER 2.4.146; the event name does not define the SDK lever scale.
            Flap selection still observes FCTL_Flaps_Lever, with a bounded 5000 ms window for the
            measured 2.8-3.5-second response, ahead of physical flap travel. Other variants remain
            untested live. See docs/APPROACH-CONTROLS-AIRCRAFT-COVERAGE.md. Brightness correction
            reviewed 2026-10-02 against installed 777-300ER 2.4.146 77W_Cockpit_Behavior.xml, SHA256
            12D6CCC5445C16D0B3BB2BBC5F2BED1031FD1D21E890161D1D6F0EA338D2CDFF: cockpit dimmers directly write
            Number LVARs clamped to 0..100: OH_DOME_SWITCH, OH_CB_LIGHT_CONTROL, OH_PANEL_LIGHT_CONTROL,
            OH_GS_PANEL_LIGHT_CONTROL, OH_GS_FLOOD_LIGHT_CONTROL, OH_MASTER_BRIGHT_ROTATE,
            LEFT_PANEL_LIGHT_CONTROL, LEFT_FLOOD_LIGHT_CONTROL, LEFT_OUTBD_BRIGHT_CONTROL,
            LEFT_INBD_BRIGHT_CONTROL, RIGHT_PANEL_LIGHT_CONTROL, RIGHT_FLOOD_LIGHT_CONTROL,
            RIGHT_INBD_BRIGHT_CONTROL, RIGHT_OUTBD_BRIGHT_CONTROL, PED_UPPER_BRIGHT_CONTROL,
            PED_LOWER_BRIGHT_CONTROL, PED_PANEL_LIGHT_CONTROL and PED_FLOOD_LIGHT_CONTROL. Setters retain
            independent SDK field confirmation and the matching live SDK adapter requirement. All 17 preset
            dimmers passed live on the -300ER; the separate master setter and other shared-adapter variants
            have not been live validated. See docs/COCKPIT-LIGHTING-VALIDATION.md for the source mapping and
            exact acceptance limits. Gear correction reviewed 2026-10-06 on installed 777-300ER 2.4.146: SDK
            event #69927 payload 1 was accepted without moving the lever or gear. Independently tested
            GEAR_DOWN and GEAR_UP events with value zero moved the SDK lever in under one second, ahead of
            roughly 16-second physical travel. The shared family adapter now uses those events, retains exact
            newer GEAR_Lever readback via controls.gearDown and the existing 2.5-second confirmation window,
            matching SDK/profile checks, 650 ms cooldown and no retry or fallback. See
            docs/PMDG-777-GEAR-VALIDATION.md for canonical retest evidence and variant limits."
        - type: official-docs
          name: PMDG MSFS 2020/2024 product family
          url: https://pmdg.com/msfs-2020-2024/

  actions:
    # Commands: ordered routes, guards, readbacks and evidence labels are unchanged.

    # systems
    systems.apuSelector.start:
      id: systems.apuSelector.start
      guard:
        groupId: pmdg777.systems.apuSelector
        cooldownMs: 3000
        retry: never
        skipWhen:
          - fieldId: systems.apuRunning
            expectedValue: true
          - fieldId: systems.apuSelectorMode
            expectedValue: start
      routes:
        - id: pmdg777.systems.apuSelector.start.rotorBrake
          transport: simconnect-sequence
          requiredSdkAdapter: clientdata-manifest
          operations:
            - type: event
              name: ROTOR_BRAKE
              value: 307
            - type: delay
              milliseconds: 500
            - type: event
              name: ROTOR_BRAKE
              value: 307
            - type: delay
              milliseconds: 500
            - type: event
              name: ROTOR_BRAKE
              value: 304
          confirmation: transport-acknowledged
      verification: untested

    # mcp
    mcp.ias.set:
      id: mcp.ias.set
      input:
        type: number
        min: 100
        max: 399
        step: 1
      guard:
        cooldownMs: 650
        groupId: pmdg777.mcp.speed
        retry: never
      routes:
        - id: pmdg777.mcp.ias.set.sdk
          transport: sdk
          adapter: clientdata-manifest
          command: "#84134"
          inputValue:
            source: input
            scale: 1
            offset: 0
            round: nearest
          readback:
            fieldId: flightGuidance.speedKts
            expectedInput: true
            timeoutMs: 2500
      verification: untested

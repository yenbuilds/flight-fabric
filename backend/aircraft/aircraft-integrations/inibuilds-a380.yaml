        - route:
            type: lvar
            name: L:INI_AIR_BLEED_ENG1
            unit: Number
          decode:
            type: enum
            values:
              "0": off
              "1": on
    systems.engineBleed2Mode:
      id: systems.engineBleed2Mode
      sources:
        - route:
            type: lvar
            name: L:INI_AIR_BLEED_ENG2
            unit: Number
          decode:
            type: enum
            values:
              "0": off
              "1": on
    systems.engineBleed3Mode:

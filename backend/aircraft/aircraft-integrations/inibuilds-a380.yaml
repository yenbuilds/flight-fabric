              name: COM2_STBY_RADIO_SET_HZ
              inputValue:
                source: input
                scale: 1000000
                round: nearest
          readback:
            fieldId: radios.com2.standbyMhz
            timeoutMs: 2500
            expectedInput: true
      verification: verified
    radios.com2.swap:
      id: radios.com2.swap
      guard:

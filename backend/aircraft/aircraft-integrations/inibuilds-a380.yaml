            A380-specific target recipe. Reproducible in-simulator verification established exact discovered
            variables INI_AIRSPEED_DIAL (selected knots 100-350), INI_HEADING_DIAL (HDG 0-359 degrees),
            INI_ALTITUDE_DIAL (100-49000 feet, 100-foot targets independent of knob scale), INI_VVI_DIAL
            (visible V/S -6000 to 6000 ft/min in 100-foot increments). Both calculator and SimConnect
            named-variable writes changed the FCU/PFD, independent autopilot targets and subsequent native
            knob movement. They are not accepted on self-echo alone. Read-only guards: INI_FCU_POWERED_VAR,
            INI_TRACK_FPA_STATE, INI_FCU_SPD_DASHED, INI_FCU_HDG_DASHED, INI_FCU_VS_DASHED, INI_FCU_SPD_DOT,
            INI_FCU_HDG_DOT. Exact source inventory, simulator/package identity, mode rejections, cycles,
            boundaries and restoration are recorded in docs/aircraft-intake/inibuilds-a380-fcu.evidence.json.
            Ground selector scope only; flight engagement and managed/Mach/TRK/FPA writes are excluded."

          retrievedAt: 2026-09-23
          notes: AUTOPILOT AIRSPEED HOLD VAR knots, AUTOPILOT HEADING LOCK DIR degrees, AUTOPILOT ALTITUDE LOCK VAR
            feet, AUTOPILOT VERTICAL HOLD VAR feet per minute. These readbacks agreed with visible A380

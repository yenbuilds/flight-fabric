    # controls
    controls.flaps:
      id: controls.flaps
      sources:
        - route:
            type: simvar
            name: FLAPS HANDLE INDEX
            unit: Number
          decode:
            type: enum
            values:
              "0": up
              "1": "1"
              "2": "2"
              "3": "3"
              "4": full
    controls.speedbrake:

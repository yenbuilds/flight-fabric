            unit: Number
          decode:
            type: enum
            values:
              "0": off
              "1": on
    systems.pack1Mode:
      id: systems.pack1Mode
      sources:
        - route:
            type: lvar
            name: L:INI_AIR_PACK1_BUTTON
            unit: Number
          decode:
            type: enum
            values:
              "0": off
              "1": on
    systems.pack2Mode:
      id: systems.pack2Mode
      sources:
        - route:
            type: lvar
            name: L:INI_AIR_PACK2_BUTTON
            unit: Number
          decode:
            type: enum
            values:
              "0": off
              "1": on
    systems.apuMaster:
      id: systems.apuMaster
      sources:
        - route:
            type: lvar
            name: L:INI_APU_MASTER_SWITCH
            unit: Number
          decode:
            type: boolean
            trueValues:
              - 1
            falseValues:
              - 0
    systems.apuStart:
      id: systems.apuStart
      sources:
        - route:
            type: lvar
            name: L:INI_APU_START_BUTTON
            unit: Number
          decode:
            type: boolean
            trueValues:
              - 1
            falseValues:
              - 0
    systems.apuAvailable:
      id: systems.apuAvailable
      sources:
        - route:
            type: lvar
            name: L:INI_APU_AVAILABLE
            unit: Number
          decode:
            type: boolean
            trueValues:
              - 1
            falseValues:
              - 0
    systems.apuMasterFault:
      id: systems.apuMasterFault
      sources:
        - route:
            type: lvar
            name: L:INI_APU_MASTER_FAULT
            unit: Number
          decode:
            type: boolean
            trueValues:
              - 1
            falseValues:
              - 0
    controls.gearHandleDown:
      id: controls.gearHandleDown
      sources:
        - route:
            type: lvar
            name: A:GEAR HANDLE POSITION
            unit: Bool
          decode:
            type: boolean
            trueValues:
              - 1
            falseValues:
              - 0
    controls.onGround:
      id: controls.onGround
      sources:

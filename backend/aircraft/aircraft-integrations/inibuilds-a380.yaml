          supportsActiveMappings: true
          name: MSFS 2024 documented LVAR read/write surface, with A380-specific live validation
          url: https://docs.flightsimulator.com/msfs2024/html/6_Programming_APIs/SimConnect/API_Reference/Events_And_Data/SimConnect_AddToDataDefinition.htm
          retrievedAt: 2026-09-23

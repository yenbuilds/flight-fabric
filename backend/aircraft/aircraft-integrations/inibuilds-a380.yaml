            type: lvar
            name: A:SIM ON GROUND
            unit: Bool
          decode:
            type: boolean
            trueValues:
              - 1
            falseValues:
              - 0
  actions:
    # Commands: ordered routes, guards, readbacks and evidence labels are unchanged.

    # flightGuidance
    flightGuidance.speed.set:
      id: flightGuidance.speed.set
      input:
        type: number
        min: 100
        max: 350
        step: 1
      guard:
        groupId: flightGuidance.fcu
        cooldownMs: 300
        retry: never
        requires:
          - fieldId: flightGuidance.powered
            expectedValue: true
            freshness: field
          - fieldId: flightGuidance.speedValue
            freshness: field
            min: 100
            max: 350
          - fieldId: flightGuidance.speedDashed
            expectedValue: false
            freshness: field
          - fieldId: flightGuidance.speedManaged
            expectedValue: false
            freshness: field
      routes:
        - id: iniA380.speed.target
          transport: simconnect-sequence
          operations:
            - type: lvar
              name: L:INI_AIRSPEED_DIAL
              unit: Number
              inputValue:
                source: input
          readbacks:
            - fieldId: flightGuidance.speedValue
              expectedInput: true
              timeoutMs: 3000
              freshness: field
            - fieldId: flightGuidance.speedConfirmed
              expectedInput: true
              timeoutMs: 3000
              freshness: field
      verification: partial
    flightGuidance.heading.set:
      id: flightGuidance.heading.set
      input:
        type: number
        min: 0
        max: 359
        step: 1
      guard:
        groupId: flightGuidance.fcu
        cooldownMs: 300
        retry: never
        requires:
          - fieldId: flightGuidance.powered
            expectedValue: true
            freshness: field
          - fieldId: flightGuidance.trackFpa
            expectedValue: false
            freshness: field
          - fieldId: flightGuidance.headingDashed
            expectedValue: false
            freshness: field
          - fieldId: flightGuidance.headingManaged
            expectedValue: false
            freshness: field
      routes:
        - id: iniA380.heading.target
          transport: simconnect-sequence
          operations:
            - type: lvar
              name: L:INI_HEADING_DIAL
              unit: Number
              inputValue:
                source: input
          readbacks:
            - fieldId: flightGuidance.headingValue
              expectedInput: true
              timeoutMs: 3000
              freshness: field
            - fieldId: flightGuidance.headingConfirmed
              expectedInput: true
              timeoutMs: 3000
              freshness: field
      verification: partial
    flightGuidance.altitude.set:
      id: flightGuidance.altitude.set
      input:
        type: number
        min: 100
        max: 49000
        step: 100
      guard:
        groupId: flightGuidance.fcu
        cooldownMs: 300
        retry: never
        requires:
          - fieldId: flightGuidance.powered
            expectedValue: true
            freshness: field
      routes:
        - id: iniA380.altitude.target
          transport: simconnect-sequence
          operations:
            - type: lvar
              name: L:INI_ALTITUDE_DIAL
              unit: Number
              inputValue:
                source: input
          readbacks:
            - fieldId: flightGuidance.altitudeValue
              expectedInput: true
              timeoutMs: 3000
              freshness: field
            - fieldId: flightGuidance.altitudeConfirmed
              expectedInput: true
              timeoutMs: 3000
              freshness: field
      verification: partial
    flightGuidance.verticalSpeed.set:
      id: flightGuidance.verticalSpeed.set
      input:
        type: number
        min: -6000
        max: 6000
        step: 100
      guard:
        groupId: flightGuidance.fcu
        cooldownMs: 300
        retry: never
        requires:
          - fieldId: flightGuidance.powered
            expectedValue: true
            freshness: field
          - fieldId: flightGuidance.trackFpa
            expectedValue: false
            freshness: field
          - fieldId: flightGuidance.verticalSpeedDashed
            expectedValue: false
            freshness: field
      routes:
        - id: iniA380.verticalSpeed.target
          transport: simconnect-sequence
          operations:
            - type: lvar
              name: L:INI_VVI_DIAL
              unit: Number
              inputValue:
                source: input
          readbacks:
            - fieldId: flightGuidance.verticalSpeedValue
              expectedInput: true
              timeoutMs: 3000
              freshness: field
            - fieldId: flightGuidance.verticalSpeedConfirmed
              expectedInput: true
              timeoutMs: 3000
              freshness: field
      verification: partial
    flightGuidance.verticalSpeed.reveal:
      id: flightGuidance.verticalSpeed.reveal
      guard:
        groupId: flightGuidance.fcu
        cooldownMs: 300
        retry: never
        requires:
          - fieldId: flightGuidance.powered
            expectedValue: true
            freshness: field
          - fieldId: flightGuidance.trackFpa
            expectedValue: false
            freshness: field
      routes:
        - id: iniA380.verticalSpeed.reveal
          transport: input-event
          inputEvent: AIRLINER_FCU_VS_KNOB
          value: 1
          readback:
            fieldId: flightGuidance.verticalSpeedDashed
            expectedValue: false
            timeoutMs: 3000
            freshness: field
      verification: partial

    # radios
    radios.com1.setStandby:
      id: radios.com1.setStandby
      guard:
        groupId: iniA380.radios.com1
        cooldownMs: 750
        retry: never
      input:
        type: number
        min: 118
        max: 136.99
        step: 0.005
      routes:
        - id: iniA380.radios.com1.setStandby.simconnectSequence
          transport: simconnect-sequence
          comRadio:
            index: 1
            operation: setStandby
          operations:
            - type: event
              name: COM_STBY_RADIO_SET_HZ
              inputValue:
                source: input
                scale: 1000000
                round: nearest
          readback:
            fieldId: radios.com1.standbyMhz
            timeoutMs: 2500
            expectedInput: true
      verification: verified
    radios.com1.swap:
      id: radios.com1.swap
      guard:
        groupId: iniA380.radios.com1
        cooldownMs: 750
        retry: never
      routes:
        - id: iniA380.radios.com1.swap.simconnectSequence
          transport: simconnect-sequence
          comRadio:
            index: 1
            operation: swap
          operations:
            - type: event
              name: COM1_RADIO_SWAP
              value: 0
          readback:
            fieldId: radios.com1.activeMhz
            timeoutMs: 2500
            confirmation: changed
      verification: verified
    radios.com1.switchTo:
      id: radios.com1.switchTo
      guard:
        groupId: iniA380.radios.com1
        cooldownMs: 750
        retry: never
      input:
        type: number
        min: 118
        max: 136.99
        step: 0.005
      routes:
        - id: iniA380.radios.com1.switchTo.simconnectSequence
          transport: simconnect-sequence
          comRadio:
            index: 1
            operation: switchTo
          operations:
            - type: event
              name: COM_STBY_RADIO_SET_HZ
              inputValue:
                source: input
                scale: 1000000
                round: nearest
            - type: event
              name: COM1_RADIO_SWAP
              value: 0
          readback:
            fieldId: radios.com1.activeMhz
            timeoutMs: 2500
            expectedInput: true
      verification: verified
    radios.com2.setStandby:
      id: radios.com2.setStandby
      guard:
        groupId: iniA380.radios.com2
        cooldownMs: 750

    radios.com2.activeMhz:
      id: radios.com2.activeMhz
      sources:
        - route:
            type: simvar
            name: COM ACTIVE FREQUENCY:2
            unit: MHz
          decode:
            type: number
            precision: 3
    radios.com2.standbyMhz:

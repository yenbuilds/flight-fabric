  actions:
    # Commands: ordered routes, guards, readbacks and evidence labels are unchanged.

    # flightGuidance
    flightGuidance.speed.set:
      id: flightGuidance.speed.set
      input:
        type: number
        min: 100
        max: 399
        step: 1
      guard:
        cooldownMs: 400
        groupId: md11.fcp
        retry: never
        requires:
          - fieldId: systems.busVoltage
            freshness: field
            min: 90
            max: 130
          - fieldId: afs.speedMode
            freshness: field
            expectedValue: ias
          - fieldId: afs.speedValue
            freshness: field
            min: 100
            max: 399
      routes:
        - id: md11.flightGuidance.speed.set.external
          transport: simconnect-sequence
          operations:
            - type: lvar
              name: L:MD11_EXTCTL_FCP_SPD
              unit: Number
              inputValue:
                source: input
          readback:
            fieldId: afs.speedValue
            expectedInput: true
            freshness: field
            timeoutMs: 3000
      verification: partial
    flightGuidance.heading.set:
      id: flightGuidance.heading.set
      input:
        type: number
        min: 0
        max: 359
        step: 1
      guard:
        cooldownMs: 400
        groupId: md11.fcp
        retry: never
        requires:
          - fieldId: systems.busVoltage
            freshness: field
            min: 90
            max: 130
          - fieldId: afs.headingMode
            freshness: field
            expectedValue: heading
          - fieldId: afs.headingValue
            freshness: field
            min: 0
            max: 359
      routes:
        - id: md11.flightGuidance.heading.set.external
          transport: simconnect-sequence
          operations:
            - type: lvar
              name: L:MD11_EXTCTL_FCP_HDG
              unit: Number
              inputValue:
                source: input
          readback:
            fieldId: afs.headingValue
            expectedInput: true
            freshness: field
            timeoutMs: 3000
      verification: partial
    flightGuidance.altitude.set:
      id: flightGuidance.altitude.set
      input:
        type: number
        min: 0
        max: 50000
        step: 100
      guard:

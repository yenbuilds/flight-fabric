# FlightFabric aircraft definition.
# Schema version 1; preserves existing data, ordering, inheritance and verification limits.

# Mapping source notes: tfdi-md-11/actions.ts
# Only documented EXTCTL inputs and CEVENT events are writable. State,
# annunciator and animation LVARs remain read-only. See MD11-CONTROL-VALIDATION.md.
# CEVENT is one shared mailbox: serialize all switch transactions.
# Both directions and all three positions confirmed on the parked PW4462.
# The EXTCTL minimums input did not move the loaded aircraft. Use the published
# wheel events, with a fresh RADIO reference and confirmation after every detent.

# Mapping source notes: tfdi-md-11/fields.ts
# TFDi publishes the MD11_AFS_*, AP/ATS, mode-flag, V-speed, and APU rows as
# read/integration variables. Light switch semantics were confirmed through
# reversible live transitions; see MD11-CONTROL-VALIDATION.md. Standard light
# bits did not follow those switches and must not confirm controls. Speedbrake telemetry is
# deliberately absent because the MD-11's Direct Lift Control can move spoiler
# panels during a normal approach.
# NAV/BCN/HI INT annunciators illuminate OFF; turnoff annunciators illuminate ON.
# Flashing bulb-output LVARs cannot confirm a steady switch selection.

schemaVersion: 1
integration:
  id: tfdi-md-11
  aircraft:
    vendor: TFDi Design
    family: McDonnell Douglas MD-11
  trustedProfileKeys:
    - bundled/msfs/tfdi-md-11

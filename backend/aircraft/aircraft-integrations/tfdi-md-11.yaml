profiles:
  # Bundled profile documents retain their exact identity, inheritance and provenance.
  bundled/msfs/tfdi-md-11:
    $schema: ../../aircraft-profile.schema.json
    version: 2
    id: tfdi-md-11
    name: TFDi Design MD-11
    simulator: msfs
    namespace: bundled
    author: null
    authorAccount: null
    createdAt: 2026-05-14T00:00:00Z
    updatedAt: 2026-09-25T00:00:00Z
    visibility: public
    extends: bundled/msfs/widebody-base
    abstract: false
    aircraft:
      category: D
      flaps:
        _comment: Do not infer SimConnect handle indexes from MD-11 flap-angle labels. On 2026-09-25 the PW4462 Low
          Poly Cabin reported handle index 1, handle 14.2857%, and actual angle 14.95 degrees while the
          cockpit showed FLAPS 15. The former table incorrectly labelled this 5. Use measured physical angle,
          or labelled raw percent when angle is unavailable, until all handle slots and Dial-a-Flap behavior
          are verified. Landing angles remain provisional family compatibility values. See
          docs/MD11-PROFILE-VALIDATION.md.
        notches: []
        landingNotches:
          - 35
          - 50
      stability:
        stabilizedGates:
          imcRaFt: 1000
          vmcRaFt: 500
      engines:
        _comment: "3 engines: 2 underwing (GE CF6-80C2D1F or PW4460/4462) + 1 centre-mounted tail-cone engine. TFDi
          models both engine variants. EPR-based thrust management."
        count: 3
        type: jet
    integration:
      aircraftSpecific:
        adapter: tfdi-md-11
      matching:
        priority: 94
        titleContains:
          - TFDi Design MD-11
          - TFDi Design MD11
          - TFDi MD-11
          - TFDi MD11
          - TFDi_Design_MD-11
        titleRegex: ^(?=.*tfdi(?:[\s_/-]*design)?)(?=.*md[\s_-]*11(?:\b|_)).*$
        configPathContains:
          - tfdidesign-aircraft-md11
          - tfdi_design_md-11
          - simobjects/airplanes/tfdi_design_md-11
        configPathRegex: (?:^|[/\\])tfdidesign-aircraft-md11(?:[/\\]|$)|(?:^|[/\\])tfdi_design_md-11(?:_[a-z0-9-]+)?(?:[/\\]|$)
        aircraftCfg:
          _comment: An MD11 designator is accepted only when both the aircraft title and creator identify TFDi; bare
            MD11 metadata may identify traffic models or other MD-11 products.
          equals:
            icao_type_designator: MD11
          containsAll:
            title:
              - TFDi Design MD-11
              - TFDi Design MD11
              - TFDi_Design_MD-11
            ui_createdby:
              - TFDi Design
              - TFDi
      telemetry:
        preferred: simconnect
        lvars:
          autopilot: MD11_AP_STATE
          autothrottle: MD11_ATS_STATE
          mcp:
            altitude: MD11_AFS_ALT
            heading: MD11_AFS_HDG
            speed: MD11_AFS_SPD
            vs: MD11_AFS_VS
        lights:
          source: simconnect
          _comment: Use the trusted MD-11 stable switch decoder for the overview. Live switch changes did not update the
            standard light mask. Missing, stale or unpowered vendor readings mark the overview unavailable.
            See docs/MD11-CONTROL-VALIDATION.md.
          simVarReliable: false
      controls:
        backend: simconnect
        genericFallback: false
        standardSurfaceFallback: true
        _comment: Guarded EXTCTL targets and CEVENT light, sign and minimums controls use the exact bundled adapter.
          Generic cockpit fallback remains disabled. See docs/MD11-CONTROL-VALIDATION.md for verified scope
          and remaining 737 coverage gaps.
      presentation:
        visualSupport: basic
        lights:
          available:
            - beacon
            - nav
            - strobe
            - landing
            - taxi
            - turnoff
            - logo
          labels:
            beacon: BCN
            nav: NAV
            strobe: STRB
            landing: LND
            taxi: TAXI
            turnoff: RWY TO
            logo: LOGO
    meta:
      developer: TFDi Design
      icaoType: MD11
      platforms:
        - msfs2020
        - msfs2024
      updated: 2026-09-25
      status: partial
      notes: "Trusted TFDi Design MD-11 monitoring and 24 guarded aircraft-specific actions: IAS/heading/altitude
        targets, exterior-light buttons and detents, cabin signs, inHg pressure and RADIO-reference minimums.
        Uses documented EXTCTL inputs and CEVENT events, never raw state writes. Live changed-and-restored
        PW4462 checks, limitations and remaining 737 parity gaps: docs/MD11-CONTROL-VALIDATION.md. Earlier
        monitoring checks: docs/MD11-PROFILE-VALIDATION.md. Other variants and airborne operation remain
        unverified."

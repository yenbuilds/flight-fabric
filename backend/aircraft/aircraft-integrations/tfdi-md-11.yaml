            35=82, 50=100. Dial-a-Flap 10, 15 and displayed 25 yielded 38, 46.91 and 64.73 with dial animation 0, 33 and
            99. The variable detent is decoded in a bounded 38-65 interval; 65 is the endpoint inferred from the
            observed linear span, not a separately observed selector value. A moving lever can traverse the takeoff
            interval; confirmation requires a fresh MD11_FLAP_LATCH=0 sample at least as recent as the handle sample.
            The final production run selected 0/EXT, TAKEOFF, 28, 35, 50 and restored TAKEOFF, with independently
            settled surface angles. UP was observed as the initial no-op baseline; its transition after the
            settled-readback correction remains untested. Spoiler 77828 increases, 77853 decreases MD11_SPDBRK_RNG:
            RET=0, 1/3=17.5, 2/3=25, FULL=32.5; ground overtravel is excluded. MD11_SPDBRK_HANDLE 0 is disarmed and 1
            armed; standard SPOILERS ARMED did not follow disarming. Left button 77829 arm/disarm and same-state no-op
            passed. Production FULL from armed first confirmed disarm, then stepped to FULL; all intermediate choices
            and RET restoration passed. FCP pairs FMS SPD 86088/86089, NAV 86090/86091, APPR LAND 86092/86093,
            AUTOFLIGHT 86094/86095, PROF 86096/86097 press/release once and acknowledge delivery without claiming
            engagement; live FMA acceptance remains pending. The vendor forward-panel guide defines AUTOFLIGHT as ATS on
            ground and AP/ATS airborne; no independent AP/ATS toggle or ATS-state enum is inferred. All actions share
            the CEVENT lock and fresh power guard. These are selector checks, not airborne or automatic-braking

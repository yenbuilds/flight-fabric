            freshness: field
            min: 90
            max: 130
      routes:
        - id: md11.lights.nav.off.event
          transport: mobiflight-calculator
          mode: pulse
          pressCode: 90267 (>L:CEVENT, Number)
          releaseCode: 90268 (>L:CEVENT, Number)
          delayMs: 150
          readback:

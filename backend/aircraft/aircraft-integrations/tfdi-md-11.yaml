            freshness: field
            min: 90
            max: 130
          - fieldId: afs.altitudeUnit
            freshness: field
            expectedValue: feet
          - fieldId: afs.altitudeValue
            freshness: field
            min: 0
            max: 50000
      routes:
        - id: md11.flightGuidance.altitude.set.external
          transport: simconnect-sequence
          operations:
            - type: lvar
              name: L:MD11_EXTCTL_FCP_ALT

# FlightFabric aircraft definition.
# Schema version 1; preserves existing data, ordering, inheritance and verification limits.

# Mapping source notes: asobo-787/index.ts
# The adapter ID follows the existing stable profile ID. Working Title supplies
# the avionics and is credited for the manual; the stock identity remains Microsoft/Asobo.

# Mapping source notes: asobo-787/actions.ts
# Microsoft/Asobo/Working Title do not publish an external 787-10 control
# contract. Keep this page monitoring-only until exact interactions and
# independent system-effect readbacks are verified in-sim.

# Mapping source notes: asobo-787/fields.ts
# No first-party external LVAR/B-var/InputEvent catalogue is published for
# the included 787-10. Expose only an explicit standard-SimVar read allowlist;
# unavailable mirrors stay blank instead of being replaced by unverified values.

schemaVersion: 1
integration:
  id: asobo-787
  aircraft:
    vendor: Microsoft / Asobo Studio
    family: Boeing 787-10 Dreamliner
  trustedProfileKeys:
    - bundled/msfs/asobo-787
  presentation:
    templateId: asobo-787
  fields:
    # Observed state: sources and decoders retain their original order.

    # mcp
    mcp.speedKts:
      id: mcp.speedKts
      sources:
        - route:
            type: simvar
            name: AUTOPILOT AIRSPEED HOLD VAR
            unit: Knots
          decode:
            type: number
            precision: 0
    mcp.headingDeg:

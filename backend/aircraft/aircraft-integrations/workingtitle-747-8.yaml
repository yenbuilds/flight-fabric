    {}
  catalogue:
    order: 10
    legacyExports:
      MICROSOFT_747_8_ADAPTER_ID:
        kind: id
        order: 14
      MICROSOFT_747_8_INTEGRATION:
        kind: integration
        order: 15
      MICROSOFT_747_8_PROFILE_KEY:

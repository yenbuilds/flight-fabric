      verification:
        status: partial
        lastVerified: 2026-09-25
        knownIssues:
          - On 2026-09-25, small wing-light, heading, IAS, captain QNH, altitude and captain ND-range changes
            were confirmed and restored on Stable v2024.1.0. Wing lights now use WING_LIGHTS_SET. Changed
            altitude targets first confirm 100-foot resolution and leave that resolution selected; same-target
            requests remain no-ops. This does not validate other controls or airborne behavior. See
            docs/FBW-A32NX-PROFILE-VALIDATION.md.
          - Most expanded routes are documentation-backed but have not been live-validated across every stable
            and development A32NX release. A selector-only or otherwise cosmetic write fails with a
            confirmation timeout when the configured logical field does not reach the requested value; a
            matching selector readback still does not prove every downstream aircraft-system effect.
          - FlyByWire states that its Flight Deck API table can lag current development. The adapter therefore
            uses only fixed bounded values, requires a fresh decodable preflight, serializes each physical
            control group, applies a 750 ms cooldown, never retries, and requires a newer confirming readback
            after dispatch.
          - Strobe coordinates LIGHTING_STROBE_0, STROBE_0_AUTO and STROBES_SET, then confirms the LIGHT
            STROBE enabled switch state for OFF/ON or the AUTO flag for AUTO. Neither proves visible flashes
            or circuit power. Installed Stable v2024.1.0 sources suppress strobe intensity on the ground in
            AUTO, consistent with the 2026-10-13 observation of AUTO armed and LIGHT STROBE enabled with no
            visible flashes. Live intensity and circuit power were not captured; other builds and airborne
            behavior remain unverified. See docs/FBW-A32NX-PROFILE-VALIDATION.md.
          - Landing, nose and runway-turnoff controls follow FlyByWire's documented selector, retraction and
            circuit contract. Landing-light ON waits 9 seconds before circuit energization; every delayed step
            revalidates the active profile generation and aborts if the aircraft changes. An interrupted
            sidecar or simulator connection can still leave a selector or retraction command partially
            applied, and these routes need live validation on current Stable and Development builds.
          - Toggle-only standard events are presented as explicit targets only because the provider first
            requires a fresh matching readback and skips dispatch when the requested target is already
            satisfied. A changed target is dispatched once and must confirm.
          - FCU speed/Mach, heading, altitude, vertical-speed/FPA, AP2 and managed/selected routes use
            FlyByWire's documented global custom client events through SimConnect. Event names and payload
            transforms are adapter-owned, mode-dependent setters require fresh mode readback before dispatch,
            toggle targets skip same-state writes, and every changed target dispatches once and requires newer
            logical readback. Small IAS, heading and altitude requests passed on Stable v2024.1.0 on
            2026-09-25; Mach, VS/FPA, guidance engagement and other build coverage remain pending.
          - The four forward-throttle detents use the midpoint of each lever's saved FlyPad calibration window
            through one MobiFlight calculator expression, then require newer exact A32NX_AUTOTHRUST_TLA:1 and
            :2 confirmation. Missing or malformed calibration bounds prevent every axis write. Reverse thrust
            and arbitrary raw-axis targets remain excluded.
          - Fire, oxygen, irreversible IDG disconnect, flight-control-computer, preset loading/saving,
            pushback motion, arbitrary flight axes and momentary controls without durable readback remain
            excluded.
          - Wipers remain excluded because the published interface requires indexed electrical-circuit power
            events and the current trusted integration transport does not provide an independently confirmed,
            position-safe indexed circuit route.
          - Start APU UI and voice preset is source-backed and covered by automated transport tests; live
            start, electrical prerequisites, selector release and aircraft variant/build coverage remain
            untested. See docs/APU-START-VALIDATION.md.

                property: value
                conditions:
                  - property: mode
                    equals: 1
                  - property: valueMode
                    equals: 1
                  - property: unitInHg
                    equals: false
                  - property: value
                    input: true
                write: setValue
                confirmation: written
                invalidate: value
            final:
              - property: mode
                equals: 1
              - property: valueMode
                equals: 1
              - property: unitInHg
                equals: false
              - property: value
                input: true
            timing:

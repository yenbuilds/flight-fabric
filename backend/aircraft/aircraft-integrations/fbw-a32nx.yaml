# FlightFabric aircraft definition.
# Schema version 1; preserves existing data, ordering, inheritance and verification limits.

# Mapping source notes: fbw-a32nx/baro.ts
# This manifest enumerates every allowed write. The confirmed executor selects
# the necessary mode/unit writes from fresh observations; it never blindly pushes.

# Mapping source notes: fbw-a32nx/actions.ts
# Coordinate the selector animation, AUTO flag and enabled light state.
# OFF/ON confirms LIGHT STROBE; AUTO confirms the dedicated mode flag.
# These reads do not prove visible flashes: the installed AUTO behavior can
# suppress intensity on the ground. See docs/FBW-A32NX-PROFILE-VALIDATION.md.
# FlyByWire documents dedicated circuit writes for the A320's coupled nose,
# landing and runway-turnoff lights. Landing-light ON additionally requires
# the lamp to extend for 8-10 seconds before its circuit is energized. These
# adapter-owned sequences use the midpoint (9 seconds), keep each physical
# selector serialized, and never retry a partially completed command.
# The logical state reads the left circuit; always dispatch so the paired
# right circuit is reconciled even when the left side is already correct.
# FlyByWire publishes these FCU controls as global custom client events.
# Numeric setters update the displayed selector only; managed/selected
# engagement is a separate push/pull action, matching the real Airbus model.
# The installed FCU rounds SET to the current knob increment. Confirm
# hundred-foot resolution first so e.g. 15100 is not rounded to 15000.
# Unit selectors and all pressure/STD commands operate the same EFIS controls.
# The official throttle API exposes each calibrated detent window and an
# independent TLA readback per lever. The calculator route validates both
# windows, targets their midpoints, and succeeds only when both TLAs confirm.
# Flight Deck API START is a request; its ON light is not APU availability.
# The A32NX custom handle has five positions. The standard aerodynamic flap
# index is a different scale and must not be used to confirm lever selection.

# Mapping source notes: fbw-a32nx/fields.ts
# The existing gauge subscription bridge supports bounded single A-var
# expressions and gives action confirmation a sequenced fresh snapshot.
# FlyByWire publishes this interface for external hardware/software. Raw names,
# units, detents, and deprecated compatibility details stay inside the adapter.

# Mapping source notes: fbw-a32nx/light-fields.yaml
# FlyByWire A32NX exterior-light reads, preserving the existing adapter contract.
# See docs/FBW-A32NX-PROFILE-VALIDATION.md for the exact live-evidence limits.
# Selector position, AUTO flag and enabled light state are separate reads.
# None establishes visible flashes: AUTO can suppress intensity on the ground.
# This LVAR uses numeric 0/1, not implicit boolean coercion.
# Preserve the gauge subscription (lvar route) for this A-var read.
# It supplies the existing sequenced snapshot used by confirmation.
# LIGHT STROBE is the enabled switch state, not intensity or circuit power.
# Standard light observations retain their existing SimVar routes. The
# provider still owns LIGHT STATES mask preference, fallback and freshness.

# Shared source notes:
# These helper notes retain their stated aircraft and verification scope.
#  Existing supported barometer command domains, shared by the opted-in adapters.

# Shared presentation: ../aircraft-command-catalogue.ts
# These helper notes retain their stated aircraft and verification scope.
# Explicit aircraft contracts, not generic MSFS potentiometer guesses. FBW
# indices come from each aircraft's Flight Deck API. Headwind was separately
# checked against its installed A330_NEO_INTERIOR.xml. Fenix names and 0..1
# bounds come from the shipped Cockpit_Behavior.xml and knob templates.
# iniBuilds A350 1.2.6 A350_Interior.behavior.xml: knob setters clamp
# these LVARs to 0..100; display BRT buttons write 35/37/39/41 in that
# same range. The adjacent even indices control contrast, not brightness.
# See docs/COCKPIT-LIGHTING-VALIDATION.md for source and live evidence.
# Headwind 10/11 are discrete ceiling/map lamps, unlike the FBW table knobs.
# Indexed pots are read through the sidecar's A: variable reader;
# they are not part of the generic telemetry SimVar subscription.
# LIGHT_POTENTIOMETER_SET takes index first, brightness second.

# Shared source notes: com-radio.ts
# These helper notes retain their stated aircraft and verification scope.
#  Opt in only after reviewing the aircraft's actual COM panel interface.

# Shared source notes: apu-start.ts
# These helper notes retain their stated aircraft and verification scope.
#  FBW's installed aircraft_preset_procedures.xml uses 3000 ms after master ON.
#  Only for vendor-documented fixed START=1 controls (not Fenix counters).

# Shared source notes: fbw-throttle-detents.ts
# These helper notes retain their stated aircraft and verification scope.
# `spN`/`lN` are documented MSFS calculator-code registers. Loading each
# bound once keeps the fail-closed four-lever expression inside MobiFlight's
# fixed Command ClientData envelope without splitting it into partial writes.

schemaVersion: 1
integration:
  id: fbw-a32nx
  aircraft:
    vendor: FlyByWire Simulations
    family: A32NX
  trustedProfileKeys:
    - bundled/msfs/fbw-a32nx
  presentation:
    templateId: fbw-a32nx
    cockpitLightingGroups:
      - actionId: lighting.preset.panels.set
        label: Panel backlighting
        fields:
          - lighting.glareshieldPercent
          - lighting.glareshieldLcdPercent
          - lighting.mainAndPedestalPercent
          - lighting.overheadPercent
      - actionId: lighting.preset.flood.set
        label: Flood and table lights
        fields:
          - lighting.mainFloodPercent
          - lighting.pedestalFloodPercent
          - lighting.captainTablePercent
          - lighting.firstOfficerTablePercent
      - actionId: lighting.preset.captainDisplays.set
        label: Captain displays
        displays: true
        fields:
          - lighting.captainPfdPercent
          - lighting.captainNdPercent
          - lighting.captainWeatherPercent
      - actionId: lighting.preset.firstOfficerDisplays.set
        label: First officer displays
        displays: true
        fields:
          - lighting.firstOfficerPfdPercent
          - lighting.firstOfficerNdPercent
          - lighting.firstOfficerWeatherPercent
      - actionId: lighting.preset.engineDisplays.set
        label: Engine and system displays
        displays: true
        fields:
          - lighting.upperDisplayPercent
          - lighting.lowerDisplayPercent

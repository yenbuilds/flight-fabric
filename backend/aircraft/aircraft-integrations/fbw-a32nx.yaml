                      scale: 100
                      otherwise: 1
                  unitInHg:
                    fieldId: flightGuidance.baroUnitCaptain
                    type: boolean01
                writes:
                  selectUnits: 0
                  selectMode: 1
                  setValue: 2
            input:
              min: 948
              max: 1084
              step: 1
              validation: offset-step
              scale: 1
            stages:
              - kind: ensure
                phase: units
                property: unitInHg
                conditions:
                  - property: unitInHg

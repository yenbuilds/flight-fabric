profiles:
  # Bundled profile documents retain their exact identity, inheritance and provenance.
  bundled/msfs/fbw-a32nx:
    $schema: ../../aircraft-profile.schema.json
    version: 2
    id: fbw-a32nx
    name: FlyByWire A32NX
    simulator: msfs
    namespace: bundled
    author: null
    authorAccount: null
    createdAt: 2026-05-02T00:00:00Z
    updatedAt: 2026-09-25T00:00:00Z
    visibility: public
    extends: bundled/msfs/airbus-base
    abstract: false
    aircraft:
      category: C
      flaps:
        _comment: "A32NX_FLAPS_HANDLE_INDEX is documented as the physical flap handle position: 0=0, 1=1/1+F, 2=2,
          3=3, 4=FULL."
        notches:
          - value: 0
            label: "0"
          - value: 1
            label: 1/1+F
          - value: 2
            label: "2"
          - value: 3
            label: "3"
          - value: 4
            label: FULL
        landingNotches:
          - 3
          - 4
      engines:
        count: 2
        type: jet
      landing:
        grades:
          perfectMinFpm: -120
          goodMinFpm: -250
          firmMinFpm: -400
          hardMinFpm: -650
          _comment: FlightFabric A320-family touchdown-rate bands aligned with the established Airbus transport grading
            policy.
    integration:
      aircraftSpecific:
        adapter: fbw-a32nx
      matching:
        priority: 90
        titleContains:
          - Airbus A320 Neo FlyByWire
          - FlyByWire A320
          - FBW A320
          - A32NX
        titleRegex: (FlyByWire.*A32|A32NX|FBW.*A32)
        configPathContains:
          - flybywire-aircraft-a320-neo
          - flybywire-aircraft-a32nx
          - fbw-a32nx
          - a32nx
        configPathRegex: (flybywire|fbw|a32nx).*(a32|a320)|(a32|a320).*(flybywire|fbw|a32nx)
      telemetry:
        preferred: simconnect
        lvars:
          _comment: A32NX LVARs are covered by authoritative profile sources. AP and A/THR use FlyByWire's current 0/1
            FCU light readbacks; the older A32NX_AUTOPILOT_1_ACTIVE compatibility variable is explicitly
            deprecated in the published API. FCU windows use the published display-value interfaces.
          autopilot: A32NX_FCU_AP_1_LIGHT_ON
          autothrottle: A32NX_FCU_ATHR_LIGHT_ON
          flaps: A32NX_FLAPS_HANDLE_INDEX
          _commentFlaps: "A32NX_FLAPS_HANDLE_INDEX is documented as the physical flaps handle position: 0=0, 1=1/1+F,
            2=2, 3=3, 4=FULL. FlightFabric uses profile flap LVARs before SimConnect flap mapping."
          spoilers:
            _comment: The cited FlyByWire interface supplies the intended armed state through A32NX_SPOILERS_ARMED and a
              0-1 handle fraction through A32NX_SPOILERS_HANDLE_POSITION; the standard SimConnect armed field
              is not used for this profile.
            armed: A32NX_SPOILERS_ARMED
            handlePosition: A32NX_SPOILERS_HANDLE_POSITION
          parkingBrake: A32NX_PARK_BRAKE_LEVER_POS
          _commentParkingBrake: The cited FlyByWire interface supplies the intended parking-brake lever state through
            A32NX_PARK_BRAKE_LEVER_POS (0=released, 1=set); the standard SimConnect field is not used for this
            profile.
          mcp:
            altitude: A32NX_FCU_AFS_DISPLAY_ALT_VALUE
            heading: A32NX_FCU_AFS_DISPLAY_HDG_TRK_VALUE
            speed: A32NX_FCU_AFS_DISPLAY_SPD_MACH_VALUE
            vs: A32NX_FCU_AFS_DISPLAY_VS_FPA_VALUE
            vsMode: A32NX_FMA_VERTICAL_MODE
            vsModeEnumVs:
              - 14
              - 15
            app: A32NX_FCU_APPR_LIGHT_ON
        lights:
          source: simconnect
      controls:
        backend: simconnect
        genericFallback: false
        standardSurfaceFallback: true
        _comment: Aircraft-specific cockpit writes resolve only through the exact-profile trusted fbw-a32nx adapter.
          The adapter exposes fixed documented LVAR values and documented SimConnect events behind fresh
          readback, stable-simulator-state checks, cooldown and no-retry guards. Standard gear and flap
          actions remain available through the narrow shared fallback.
      presentation:
        visualSupport: basic
        lights:
          available:
            - beacon
            - nav
            - strobe
            - landing
            - taxi
            - logo
            - wing
          labels:
            beacon: BCN
            nav: NAV
            strobe: STRB
            landing: LND
            taxi: NOSE
            logo: LOGO
            wing: WING
    meta:
      developer: FlyByWire Simulations
      platforms:
        - msfs2020
        - msfs2024
      contributor: YenBuilds
      updated: 2026-09-25
      status: partial
      notes: "FlyByWire A32NX (Airbus A320neo). Activates the trusted A32NX aircraft page with 166
        documentation-backed logical read fields and 292 semantic actions spanning FCU targets and
        managed/selected controls, FCU mode buttons, paired calibrated forward-throttle detents, EFIS/ND
        selectors, exterior lights, signs, electrical, APU, pneumatic, air conditioning, anti-ice, ADIRS,
        brakes, exact flap lever selection, spoilers, engine controls, switching, weather radar, ATC/TCAS, RMP
        and ECAM. FCU targets use only FlyByWire's fixed documented global custom client events through the
        native SimConnect event bridge. Fixed flap lever events confirm the custom A32NX_FLAPS_HANDLE_INDEX
        values 0..4; the standard aerodynamic FLAPS HANDLE INDEX is not used. Approach control review and
        pinned vendor source: docs/A32NX-APPROACH-CONTROLS.md. ATC/EFIS and minimums review 2026-09-07:
        docs/A32NX-ATC-EFIS-VOICE.md records pinned source evidence for XPNDR_SET BCO16, XPNDR_IDENT_ON, sided
        ND/LS, and bounded local SimBridge MCDU BARO/RADIO minimums entry. Minimums require active PERF APPR
        and a clear scratchpad; no output-LVAR writes or automatic navigation are used. Every
        aircraft-specific action requires the exact bundled profile, a supported bounded transport, fresh
        preflight readback, per-control cooldown and post-write confirmation; routes never retry. The IDLE,
        CLB, FLX/MCT, and TOGA controls use each lever's saved calibration-window midpoint and require
        independent newer TLA confirmation. Landing-light ON uses FlyByWire's documented guarded extension
        delay before circuit energization. Reverse thrust, arbitrary axis targets, irreversible
        fire/IDG/oxygen actions, presets and pushback motion remain excluded. Parked Stable v2024.1.0 checks
        and two reliability corrections are recorded in docs/FBW-A32NX-PROFILE-VALIDATION.md."
    provenance:
      sources:
        - type: official-docs
          authority: simulator-vendor
          access: public
          supportsActiveMappings: true
          name: MSFS indexed transponder events and BCO16 code
          url: https://docs.flightsimulator.com/msfs2024/html/6_Programming_APIs/Key_Events/Aircraft_Radio_Navigation_Events.htm
          retrievedAt: 2026-09-07
          notes: XPNDR_SET takes four octal digits packed as BCO16. XPNDR_IDENT_ON activates indexed TRANSPONDER IDENT
            for the normal timed period; the A32NX uses transponder index 1 for both source-selector
            positions. TRANSPONDER CODE:1 and TRANSPONDER STATE:1 provide code and powered/transmitting state.
            The related official Aircraft_RadioNavigation_Variables page documents these indexed readbacks.
            Live ATC validation remains pending.
        - type: official-sdk
          authority: aircraft-vendor
          access: public
          supportsActiveMappings: true
          name: FlyByWire A32NX PERF APPR minimums and FMGC entry handlers (pinned source)
          url: https://github.com/flybywiresim/aircraft/blob/5702838ee1d27dd50386d9a3490d686a4128786f/fbw-a32nx/src/systems/instruments/src/MCDU/legacy_pages/A320_Neo_CDU_PerformancePage.ts
          retrievedAt: 2026-09-07
          notes: PERF APPR calls setPerfApprMDA on R2 to store approachBaroMinimum and clears RADIO with setPerfApprDH.
            R3 calls setPerfApprDH to store approachRadioMinimum and clears BARO with setPerfApprMDA. RADIO is
            available only for an ILS approach. A32NX_FMCMainDisplay.ts at the same revision validates BARO
            0..39000 feet or destination runway threshold through threshold+5000, and RADIO 0..5000 feet.
            Output AIRLINER_MINIMUM_DESCENT_ALTITUDE and AIRLINER_DECISION_HEIGHT LVARs are not supported
            inputs. The paired A320_Neo_CDU_MainDisplay.ts exposes event:left numeric/R2/R3 keys,
            requestUpdate and update JSON with title, lines and scratchpad. FlightFabric requires a fresh
            active PERF APPR page and empty scratchpad, confirms each key and the final stored entry, never
            navigates or clears input, and stops on interruption without retry. Full evidence and
            live-validation limits are in docs/A32NX-ATC-EFIS-VOICE.md.
        - type: official-sdk
          authority: aircraft-vendor
          access: public
          supportsActiveMappings: true
          name: FlyByWire SimBridge MCDU WebSocket gateway (pinned source)
          url: https://github.com/flybywiresim/simbridge/blob/94300badd1a6d78933b68a12e50bee987f6b24e2/apps/server/src/interfaces/mcdu.gateway.ts
          retrievedAt: 2026-09-07
          notes: The /interfaces/v1/mcdu gateway broadcasts requestUpdate, update JSON and event messages among the
            aircraft and remote MCDU clients. The bounded simbridge-mcdu minimums adapter uses only localhost
            port 8380, fixed numeric keys and R2/R3, with fresh screen checks, current profile/lifecycle
            guards, a shared lock/cooldown and a 9-second deadline. No browser-supplied URLs, key names or raw
            protocol messages are accepted.

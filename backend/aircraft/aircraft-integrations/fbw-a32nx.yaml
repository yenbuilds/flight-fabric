              handshakeTimeoutMs: 1500
              maxPayload: 65536
            messages:
              invalidValue: Minimums require whole feet within the published range.
              stale: Aircraft changed or simulator disconnected. Minimums were not confirmed.
              timeout: MCDU timed out. Check the entry before trying again.
              unavailable: FlyByWire SimBridge is unavailable. Start it on this PC using port 8380 and enable it in the EFB.
              disconnected: MCDU disconnected. Check minimums in the aircraft.
              interference: Another MCDU input interrupted minimums entry. Check the scratchpad and minimums.
              invalidPage: The MCDU returned an invalid page. Minimums were not confirmed.
              connectTimeout: FlyByWire SimBridge did not connect on port 8380.
              pageRequired: Open the active PERF APPR page on the powered captain MCDU, with an empty scratchpad.
              scratchpadOccupied: Clear the MCDU scratchpad before setting minimums.
              fieldUnavailable: RADIO minimums are unavailable for this approach. Use BARO or select an ILS approach.
              entryChanged: MCDU page or scratchpad changed. Check the entry before trying again.
              digitUnconfirmed: MCDU digit entry was not confirmed. Check the scratchpad before trying again.

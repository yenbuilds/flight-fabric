                write: selectUnits
                confirmation: written
                invalidate: value
                freeze:
                  conditions:
                    - property: unitInHg
                      equals: false
                  message: Barometer units changed during the request.
              - kind: transition
                phase: QNH mode
                property: mode
                conditions:
                  - property: mode
                    equals: 1
                write: selectMode
                maxTransitions: 2
                completion:
                  - property: mode
                    equals: 1
                  - property: valueMode
                    equals: 1
                invalidate: value
                freeze:
                  conditions:
                    - property: mode
                      equals: 1
                  message: Barometer mode changed during the request.

profiles:
  # Bundled profile documents retain their exact identity, inheritance and provenance.
  bundled/msfs/headwind-a330:
    $schema: ../../aircraft-profile.schema.json
    version: 2
    id: headwind-a330
    name: Headwind A330-900neo
    simulator: msfs
    namespace: bundled
    author: null
    authorAccount: null
    createdAt: 2026-05-15T00:00:00Z
    updatedAt: 2026-07-24T00:00:00Z
    visibility: public
    extends: bundled/msfs/airbus-base
    abstract: false
    aircraft:
      category: D
      flaps:
        _comment: A330-900neo flap lever positions 0-4. Config 1 is transitional; lever position 1 selects Config 1+F.
          Aircraft-specific speed limits remain provisional until supported by vendor documentation.
        notches:
          - value: 0
            label: "0"
          - value: 1
            label: 1+F
          - value: 2
            label: "2"
          - value: 3
            label: "3"
          - value: 4
            label: FULL
        landingNotches:
          - 3
          - 4
      stability:
        speedBand:
          belowVrefKts: 5
          aboveVrefKts: 15
        vsLimits:
          downFpm: 1000
          upFpm: 200
        thrustMinPct: 20
        pitch:
          minDeg: -3
          maxDeg: 12
        stabilizedGates:
          imcRaFt: 1000
          vmcRaFt: 500
      landing:
        grades:
          perfectMinFpm: -120
          goodMinFpm: -250
          firmMinFpm: -400
          hardMinFpm: -550
          _comment: Provisional wide-body landing-rate bands pending aircraft-specific source verification.
      engines:
        count: 2
        type: jet
    integration:
      matching:
        priority: 90
        titleContains:
          - Headwind A330
          - Headwind A330-900neo
          - Headwind A339X
          - A339X
        titleRegex: headwind.*A330|A330.*headwind|headwind.*A339X|A339X
        configPathContains:
          - headwind-a330
          - headwind-a339x
          - headwind-aircraft-a330
          - headwind-aircraft-a339x
        configPathRegex: headwind.*(a330|a339x)|(a330|a339x).*headwind
      telemetry:
        preferred: simconnect
        _comment: Headwind does not publish a compatibility contract for the complete FlyByWire interface, so standard
          SimConnect is the only active telemetry path pending A339X-specific verification.
        lights: {}
      controls:
        backend: simconnect
        _comment: The exact Headwind adapter exposes only bounded cockpit and flight-display lighting presets, checked
          against the installed A330_NEO_INTERIOR.xml. Other custom cockpit writes remain unmapped.
      presentation:
        visualSupport: basic
      aircraftSpecific:
        adapter: headwind-a330
    meta:
      developer: Headwind Simulations
      platforms:
        - msfs2020
        - msfs2024
      updated: 2026-07-24
      status: experimental
      notes: Headwind A330-900neo (A330-941, Trent 7000). Independently reviewed cockpit lighting, indexed exterior
        lamps and strobe OFF/AUTO/ON routes use the installed A339X interfaces recorded in provenance. Broader
        inherited A32NX telemetry and custom FCU writes remain unmapped pending A339X-specific verification.
    provenance:
      sources:
        - type: official-sdk
          name: Headwind A339X source repository
          url: https://github.com/headwindsim/aircraft
          retrievedAt: 2026-06-05
          notes: Official Headwind project repository. Documents that the A339X is based on the FlyByWire System A32NX
            and identifies the A330-941 / Trent 7000 target aircraft. No inherited aircraft-specific variables
            are activated without a documented compatibility contract and in-sim verification.

profiles:
  # Bundled profile documents retain their exact identity, inheritance and provenance.
  bundled/msfs/microsoft-737-max-8:
    $schema: ../../aircraft-profile.schema.json
    version: 2
    id: microsoft-737-max-8
    name: Microsoft / Asobo Studio Boeing 737 MAX 8
    simulator: msfs
    namespace: bundled
    author: null
    authorAccount: null
    createdAt: 2026-06-10T00:00:00Z
    updatedAt: 2026-10-02T00:00:00Z
    visibility: public
    extends: bundled/msfs/boeing-base
    abstract: false
    aircraft:
      category: D
      _commentFlaps: No aircraft-specific flap detents are configured; use physical flap angle or raw handle percent
        pending in-sim handle-index verification.
      engines:
        count: 2
        type: jet
    integration:
      aircraftSpecific:
        adapter: microsoft-737-max-8
      matching:
        priority: 96
        titleExcludes:
          - iFly
          - PMDG
          - Bredok3D
          - FSLTL
          - AIG Traffic
          - IVAO MTL
          - PassiveAircraft
          - Generic
          - SomeVendor
        titleRegex: ^(?:boeing[\s_/-]+737[\s_-]*max[\s_-]*8|(?:microsoft(?:[\s_/+-]*asobo(?:[\s_-]*studio)?)?|asobo(?:[\s_-]*studio)?)[\s_/-]+(?:boeing[\s_/-]+)?b?737[\s_-]*max[\s_-]*8)$
        configPathExcludes:
          - ifly
          - pmdg
          - bredok3d
          - fsltl
          - aig-traffic
          - ivao-mtl
          - passiveaircraft
          - community
          - generic
        configPathRegex: (?:^|[/\\])(?:fs24-)?asobo-aircraft-b737max8(?:[/\\]|$)|(?:^|[/\\])SimObjects[/\\]Airplanes[/\\]Asobo_B737_MAX8[/\\]aircraft\.cfg$|(?:^|[/\\])SimObjects[/\\]Airplanes[/\\]asobo_b737max[/\\]presets[/\\]asobo[/\\]b737max8_passengers[/\\]config[/\\]aircraft\.cfg$
        aircraftCfg:
          _comment: Use aircraft.cfg only when B38M is paired with an exact canonical or Microsoft/Asobo-qualified MAX 8
            title and an exact first-party creator. B38M alone is intentionally insufficient. Optional
            traffic/selectability fields are not required because Microsoft permits them to be omitted.
          equals:
            icao_type_designator: B38M
          regex:
            title: ^(?:boeing[\s_/-]+737[\s_-]*max[\s_-]*8|(?:microsoft(?:[\s_/+-]*asobo(?:[\s_-]*studio)?)?|asobo(?:[\s_-]*studio)?)[\s_/-]+(?:boeing[\s_/-]+)?b?737[\s_-]*max[\s_-]*8)$
            ui_createdby: "^(?:microsoft(?: corporation)?|asobo(?: studio)?)$"
      telemetry:
        preferred: simconnect
        lvars:
          _comment: Four documented A-var reads supply wing, nose taxi and left/right runway-turnoff outputs. Two
            aircraft-scoped L:1 variables confirm fixed landing selectors independently of TAXI AUTO lamp
            behavior. The adapter separately subscribes to altitude slot 3 in feet.
          lights:
            wing: A:LIGHT WING
            landing_left: L:1:XMLVAR_LIGHT_LANDING_FIXED_L
            landing_right: L:1:XMLVAR_LIGHT_LANDING_FIXED_R
            taxi: A:LIGHT TAXI ON:3
            turnoff_left: A:LIGHT TAXI ON:1
            turnoff_right: A:LIGHT TAXI ON:2
        spoilers:
          scale: percent
        lights:
          source: lvar
      controls:
        backend: simconnect
        genericFallback: false
        standardSurfaceFallback: true
        _comment: 46 guarded actions, 25 confirmation fields and 46 logical fields. Thirty standard events and four
          native Input Events. Altitude writes slot 3 and confirms its actual MCP display source. Native taxi
          targets only the nose selector; landing confirms both scoped fixed selectors. Individual NAV/strobe
          requests preserve the other output; phase presets set and confirm POSITION outputs together. Writes
          remain bounded, identity-bound, fresh-readback confirmed and never retried. Flight modes remain
          unvalidated.
      presentation:
        visualSupport: basic
        lights:
          available:
            - beacon
            - nav
            - strobe
            - landing
            - taxi
            - turnoff
            - logo
            - wing
          labels:
            beacon: BCN
            nav: NAV
            strobe: STRB
            landing: LND
            taxi: NOSE
            turnoff: RTO
            logo: LOGO
            wing: WING
    meta:
      developer: Microsoft / Asobo Studio
      platforms:
        - msfs2024
      updated: 2026-10-02
      status: experimental
      notes: "Experimental exact passenger-preset integration: 46 fields, 46 guarded actions, seven bounded gauge
        subscriptions. Parked follow-up on 2026-10-02 corrected altitude slot, landing selector confirmation,
        taxi collateral switching and combined POSITION presets. MCP heading, IAS and corrected altitude
        changes/restoration were visually observed; three phase presets passed the production command service.
        Action labels remain untested pending broader acceptance. No flight or variant parity is asserted. See
        docs/MICROSOFT-737-MAX-PROFILE-VALIDATION.md."

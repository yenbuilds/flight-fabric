            precision: 0

    # lighting
    lighting.overheadCircuitBreakerPercent:
      id: lighting.overheadCircuitBreakerPercent
      sources:
        - route:
            type: lvar
            name: L:OH_CB_PANEL_LIGHT_CONTROL

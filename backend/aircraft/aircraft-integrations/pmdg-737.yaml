profiles:
  # Bundled profile documents retain their exact identity, inheritance and provenance.
  bundled/msfs/pmdg-737:
    $schema: ../../aircraft-profile.schema.json
    version: 2
    id: pmdg-737
    name: PMDG Boeing 737-800
    simulator: msfs
    namespace: bundled
    author: null
    authorAccount: null
    createdAt: 2025-01-03T00:00:00Z
    updatedAt: 2026-08-24T00:00:00Z
    visibility: public
    extends: bundled/msfs/boeing-base
    abstract: false
    aircraft:
      category: D
      flaps:
        notches:
          - value: 0
            label: UP
          - value: 1
            label: "1"
          - value: 2
            label: "2"
          - value: 5
            label: "5"
          - value: 10
            label: "10"
          - value: 15
            label: "15"
          - value: 25
            label: "25"
          - value: 30
            label: "30"
          - value: 40
            label: "40"
        landingNotches:
          - 30
          - 40
      stability:
        speedBand:
          belowVrefKts: 5
          aboveVrefKts: 15
        vsLimits:
          downFpm: 1000
          upFpm: 200
        thrustMinPct: 25
        pitch:
          minDeg: -5
          maxDeg: 12
      landing:
        grades:
          perfectMinFpm: -150
          goodMinFpm: -300
          firmMinFpm: -500
          hardMinFpm: -600
          _comment: "737: <150 fpm butter, 150-300 excellent, 300-500 firm/normal, 500-600 heavy (pre-inspection), >600
            hard landing inspection per Boeing AMM"
      throttle:
        type: servo
      engines:
        count: 2
        type: jet
        _comment: Exact CFM56 idle and limit N1 percentages are intentionally omitted until a public
          Boeing/engine-source reference is checked in.
    integration:
      aircraftSpecific:
        adapter: pmdg-737
      matching:
        priority: 100
        titleContains:
          - PMDG 737-800
          - PMDG Boeing 737-800
          - PMDG B738
        titleRegex: pmdg.*(737[- ]?800|b738)|(737[- ]?800|b738).*pmdg
        configPathContains:
          - pmdg-aircraft-738
          - pmdg-737-800
          - pmdg_737_800
        configPathRegex: pmdg.*(737[-_ ]?800|738|b738)|(737[-_ ]?800|738|b738).*pmdg
      telemetry:
        preferred: sdk
        sdk:
          adapter: clientdata-manifest
          connector: pmdg-737-ng3-clientdata
          target:
            channel: pmdg-737-ng3-clientdata
        autopilot:
          simVarReliable: false
        spoilers:
          _comment: The official SDK supplies authoritative speedbrake annunciators but no continuous handle position.
            Core spoiler position therefore remains on the standard SimConnect percent path.
          scale: percent
        lights:
          simVarReliable: false
      controls:
        backend: pmdg
        genericFallback: false
        standardSurfaceFallback: false
        _comment: PMDG 737 writes use the shared adapter, official SDK routes, and the exact 0..300 dimmer LVars
          defined by the installed PMDG cockpit behavior. Generic AP, flap key-event, and unrelated LVar write
          paths are intentionally absent. Gear UP/DOWN uses reviewed standard events within the shared
          adapter, with exact PMDG SDK handle confirmation.
      signalReliability:
        stabilityScore: authoritative
      presentation:
        visualSupport: full
        lights:
          available:
            - beacon
            - nav
            - strobe
            - landing
            - taxi
            - turnoff
            - logo
            - wing
          labels:
            beacon: ANTI
            nav: POS
            strobe: STRB
            landing: LND
            taxi: TAXI
            turnoff: RWY TO
            logo: LOGO
            wing: WING
    meta:
      developer: PMDG
      platforms:
        - msfs2020
        - msfs2024
      contributor: YenBuilds
      updated: 2026-08-24
      status: partial
      notes: PMDG 737-800 family profile using the official NG3 SDK and guarded backend-owned event routes. SDK data
        requires EnableDataBroadcast=1; writes require matching live ClientData and the SDK event writer.
    provenance:
      sources:
        - type: official-sdk
          authority: simulator-vendor
          access: public
          supportsActiveMappings: true
          name: MSFS radio events and transponder state
          url: https://docs.flightsimulator.com/msfs2024/html/6_Programming_APIs/Key_Events/Aircraft_Radio_Navigation_Events.htm
          retrievedAt: 2026-09-07
          notes: Defines XPNDR_SET BCO16 encoding and TRANSPONDER CODE:1 / TRANSPONDER STATE:1 state. Aircraft
            compatibility is reviewed separately against the original integrations cited in
            docs/ATC-EFIS-AIRCRAFT-COVERAGE.md. Squawk writes require fresh powered state and a newer
            selected-code readback. IDENT uses the aircraft button, not a generic IDENT event.
        - type: community
          authority: community
          access: public
          supportsActiveMappings: false
          name: PMDG 737 original squawk integration report
          url: https://forum.pmdg.com/forum/main-forum/cockpit-builders/385351-pmdg_ng3_sdk-h-%E2%80%93-no-event-for-setting-transponder-code
          retrievedAt: 2026-09-07
          notes: The original developer reports using XPNDR_SET on the PMDG 737-800. This is a first-hand integration
            report, not a PMDG staff endorsement. Family compatibility remains untested locally.
        - type: official-sdk
          authority: aircraft-vendor
          access: vendor-install
          supportsActiveMappings: true
          name: PMDG 737 MSFS SDK and installed aircraft behavior definitions
          url: https://manuals.pmdg.com/737/PMDG_737_MSFS_Introduction.pdf
          retrievedAt: 2026-09-06
          notes: "The installed PMDG 737 SDK manual, PMDG_NG3_SDK.h, connection sample, and 73X_Cockpit_Behavior.xml
            define the 916-byte NG3 ClientData contract, direct-position control events, data-broadcast
            requirement and model variants. The installed header publishes battery, standby-power,
            transfer-bus, IRS, window-heat, APU, ground-power, bus-powered, gear-handle, autobrake,
            parking-brake, pack, bleed, anti-ice, yaw-damper, and stabilizer-trim readbacks. The installed
            behavior defines direct targets for all nine normal flap-handle detents; FlightFabric confirms
            them against the cockpit lever L:NGXFlapLever using exact raw values 0/10/20/30/40/50/60/70/80,
            independently observed for UP/1/2/5/10/15/25/30/40 on the 737-800 SSW on 2026-10-06. The installed
            cockpit animation reads this lever; standard FLAPS HANDLE INDEX lags selection during surface
            travel, while ClientData publishes flap needles rather than the handle. Confirmation requires
            fresh per-field lever readback. See docs/PMDG-737-FLAPS-VALIDATION.md; other variants require live
            qualification. It also defines 0..300 LVar positions for 16 continuously dimmable controls:
            OH_CB_PANEL_LIGHT_CONTROL, OH_PANEL_LIGHT_CONTROL, CA_MAIN_PANEL_LIGHT_CONTROL,
            FO_MAIN_PANEL_LIGHT_CONTROL, CA_BACKGROUND_BRT_CONTROL, CA_AFDS_FLOOD_LIGHT_CONTROL,
            PED_FLOOD_LIGHT_CONTROL, PED_PANEL_LIGHT_CONTROL, CA_OUTBD_DU_BRIGHT_CONTROL,
            CA_INBD_DU_BRIGHT_CONTROL, CA_INBD_DU_RDR_BRIGHT_CONTROL, CA_UPPER_DU_BRIGHT_CONTROL,
            CA_LOWER_DU_BRIGHT_CONTROL, FO_OUTBD_DU_BRIGHT_CONTROL, FO_INBD_DU_BRIGHT_CONTROL, and
            FO_INBD_DU_RDR_BRIGHT_CONTROL. The cockpit-lighting preset writes those exact positions in four
            guarded groups and confirms every LVar as a whole percentage. Discrete dome/spot lights, chart/map
            mechanisms, EFB buttons, CDU internals, and the explicitly inoperative lower-DU inner knob are
            excluded. Spring-loaded ground-power and APU-generator controls use reviewed ROTOR_BRAKE
            direction/release sequences. Gear UP/DOWN uses GEAR_UP/GEAR_DOWN with value zero and newer exact
            SDK handle readback within 2.5 seconds. The numeric #70087 DOWN payload was accepted without
            moving the handle live; the standard-event replacement passed both directions through the
            canonical command service on 737-800 SSW on 2026-10-06. The shared 737-600/700/800/900 route
            retains SDK/profile checks, cooldown and no retry or fallback. OFF and transitions starting at OFF
            remain unverified and unchanged. See docs/PMDG-737-GEAR-VALIDATION.md. Other stable selectors use
            matching direct SDK event IDs and exact logical readback. Existing NAV1 controls 729/732/733, NAV2
            controls 845/848/849, and position-light control 123 retain their reviewed ROTOR_BRAKE
            compatibility encodings. The installed PMDG SDK assigns direct course-set events #84132 to the
            captain window and #84133 to the first-officer window. FlightFabric maps that contract through the
            clientdata-manifest adapter and checked-in pmdg-737-ng3-clientdata connector. The public source
            includes FlightFabric's independently written SDK interoperability mappings but not PMDG headers,
            manuals, samples, binaries, or other vendor files. APU START correction reviewed 2026-09-10 after
            a reported voice-start failure, installed PMDG 737-800 4.0.63: 73X_Cockpit_Behavior.xml component
            ngx_switch_118_a defines control 118 with press action 1 or 2 chosen by mouse click half and
            release action 4. Direction correction 2026-09-17 after a clickable-preset no-effect report:
            locally installed community presets stepping L:switch_118_73X (0 OFF, 50 ON, 100 START) show 11801
            advances toward START and 11802 retreats toward OFF, so the earlier 11802 recipe was moving the
            selector the wrong way. Timing correction 2026-09-14: START sends ROTOR_BRAKE 11801, pauses 500
            ms, sends 11801, pauses 500 ms, then sends 11804. These bounded interaction pauses allow the
            switch to reach START before release; they are not an APU availability wait. This replaces the
            ineffective direct SDK event 69750 payload 2; the NG3 SDK OFF=0, ON=1, START=2 values describe
            selector readback. The sequence retains matching SDK connectivity, exact-profile routing, cooldown
            and no retry, and acknowledges only after all three interactions are accepted. Selector ON, EGT
            and low-oil indication are not treated as proof of running. No spool-up delay is added; live
            retesting is pending. See docs/APU-START-VALIDATION.md. ATC/EFIS review 2026-09-07: installed
            SDK/header and cockpit XML define EFIS_RangeSel, EFIS_MinsSelBARO and the IDENT mouse interaction
            through ROTOR_BRAKE (press switch*100+1, release switch*100+4). 737 switch 806, SDK range offsets
            414/415 and minimums reference 404/405 in the 916-byte native layout. Approach-control review
            2026-09-07 against installed PMDG_NG3_SDK.h (4.0.63): DOWN/50PCT/UP speedbrake targets use events
            76423/76425/76427, each one left press/release. Independently sampled SPOILERS HANDLE POSITION
            Percent must confirm 0/50/100; agreement requires live verification. Existing autobrake detents
            now share canonical UI/voice. See docs/APPROACH-CONTROLS-AIRCRAFT-COVERAGE.md."
        - type: official-sdk
          authority: simulator-vendor
          access: public
          supportsActiveMappings: true
          name: Microsoft Flight Simulator Aircraft Radio Navigation Events
          url: https://docs.flightsimulator.com/msfs2024/html/6_Programming_APIs/Key_Events/Aircraft_Radio_Navigation_Events.htm
          retrievedAt: 2026-08-24
          notes: NAV1_RADIO_SET and NAV2_RADIO_SET accept Frequency BCD16 payloads and directly set their respective
            active NAV frequencies. FlightFabric sends both events in one guarded PMDG command and
            independently confirms both active-frequency SimVars.
      verification:
        status: partial
        lastVerified: 2026-07-31
        knownIssues:
          - The 737-800 is the first live-validation target; the 600, 700, and 900 family profiles require
            in-aircraft testing.
          - SDK readback requires EnableDataBroadcast=1.
          - The direct NAV and position-light routes are guarded and remain unverified until simulator
            confirmation.
          - The paired NAV 1 + NAV 2 active-frequency command uses documented standard simulator events but
            remains unverified in a live PMDG 737 cockpit.
          - The paired captain + first-officer MCP course command uses the installed SDK direct-set events but
            remains unverified in a live PMDG 737 cockpit.
          - The 16-dimmer cockpit-lighting percentage preset follows the installed 737-800 behavior
            definitions but remains unverified end to end in the simulator and requires family-variant
            confirmation.
          - Initial-power, speedbrake, gear OFF, brake, pack, bleed, anti-ice, and stabilizer-trim writes
            remain unverified until end-to-end simulator passes are completed. Flap selection and gear UP/DOWN
            have live 737-800 SSW evidence; gear transitions starting at OFF, other variants and
            microphone-to-cockpit end-to-end use still require validation. See
            docs/PMDG-737-FLAPS-VALIDATION.md and docs/PMDG-737-GEAR-VALIDATION.md.
          - MCP mode and selector actions remain untested until IAS/Mach, VS, and button behavior are
            confirmed in the aircraft.
          - The official SDK exposes speedbrake annunciators but not a continuous handle position; spoiler
            state stays on standard SimConnect percent telemetry.
          - Start APU UI and voice preset is source-backed and covered by automated transport tests; live
            start, electrical prerequisites, selector release and aircraft variant/build coverage remain
            untested. See docs/APU-START-VALIDATION.md.

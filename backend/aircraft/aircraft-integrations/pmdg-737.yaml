  actions:
    # Commands: ordered routes, guards, readbacks and evidence labels are unchanged.

    # radios
    radios.navBoth.setActive:
      id: radios.navBoth.setActive
      input:
        type: number
        min: 108
        max: 117.95
        step: 0.05
      guard:
        cooldownMs: 450
        groupId: pmdg737.radios.navBoth
        retry: never
      routes:
        - id: pmdg737.radios.navBoth.setActive.simconnectSequence
          transport: simconnect-sequence
          operations:
            - type: event
              name: NAV1_RADIO_SET
              inputValue:
                source: input
                encoding: frequency-bcd16
            - type: event
              name: NAV2_RADIO_SET
              inputValue:
                source: input
                encoding: frequency-bcd16
          readbacks:
            - fieldId: radios.nav1ActiveMhz
              expectedInput: true
              timeoutMs: 2500
            - fieldId: radios.nav2ActiveMhz
              expectedInput: true
              timeoutMs: 2500
      verification: untested

    # mcp
    mcp.courseBoth.set:
      id: mcp.courseBoth.set
      input:
        type: number
        min: 0
        max: 359
        step: 1
      guard:
        cooldownMs: 450
        groupId: pmdg737.mcp.course
        retry: never
      routes:
        - id: pmdg737.mcp.courseBoth.set.simconnectSequence
          transport: simconnect-sequence
          operations:
            - type: event
              name: "#84132"
              inputValue:
                source: input
                round: nearest
            - type: event
              name: "#84133"
              inputValue:
                source: input
                round: nearest
          readbacks:
            - fieldId: mcp.courseCaptainDeg
              expectedInput: true
              timeoutMs: 2500
            - fieldId: mcp.courseFirstOfficerDeg
              expectedInput: true
              timeoutMs: 2500
      verification: untested

    # lighting
    lighting.cockpit.panels.set:
      id: lighting.cockpit.panels.set
      input:
        type: number
        min: 0
        max: 100
        step: 1
      guard:
        cooldownMs: 0
        groupId: pmdg737.lighting.cockpit
        retry: never
      routes:
        - id: pmdg737.lighting.cockpit.panels.set.simconnectSequence
          transport: simconnect-sequence
          operations:
            - type: lvar
              name: L:OH_CB_PANEL_LIGHT_CONTROL
              unit: Number
              inputValue:
                source: input
                scale: 3
                round: nearest
            - type: lvar
              name: L:OH_PANEL_LIGHT_CONTROL
              unit: Number
              inputValue:
                source: input
                scale: 3
                round: nearest
            - type: lvar
              name: L:CA_MAIN_PANEL_LIGHT_CONTROL
              unit: Number
              inputValue:
                source: input
                scale: 3
                round: nearest
            - type: lvar
              name: L:FO_MAIN_PANEL_LIGHT_CONTROL
              unit: Number
              inputValue:
                source: input
                scale: 3
                round: nearest
          readbacks:
            - fieldId: lighting.overheadCircuitBreakerPercent
              expectedInput: true
              timeoutMs: 2500
            - fieldId: lighting.overheadPanelPercent
              expectedInput: true
              timeoutMs: 2500
            - fieldId: lighting.mainPanelCaptainPercent
              expectedInput: true
              timeoutMs: 2500
            - fieldId: lighting.mainPanelFirstOfficerPercent
              expectedInput: true
              timeoutMs: 2500
      verification: untested
    lighting.cockpit.ambient.set:
      id: lighting.cockpit.ambient.set
      input:
        type: number
        min: 0
        max: 100
        step: 1
      guard:

# FlightFabric aircraft definition.
# Schema version 1; preserves existing data, ordering, inheritance and verification limits.

# Mapping source notes: pmdg-737/actions.ts
# PMDG's ROTOR_BRAKE compatibility encoding uses compact mouse action IDs,
# not the DWORD mouse flags used by the direct `#nnnnn` event route.
# The four reviewed lighting groups form one parameterized preset and
# execute serially. A zero cooldown lets adjacent groups share the same
# exclusion key while the in-flight guard still rejects overlap.
# Fixed landing-light readback is boolean, but its event uses OFF=0 and full
# ON=2. Sending 1 leaves the switch at centre. See EXTERIOR-LIGHTS-VALIDATION.md.
# A true boolean alone cannot prove full ON. Always send that fixed
# target, including when correcting a previous centre-position write.
# PMDG's installed NG3 connection sample sends direct 0/1 positions to the logo-light
# event. Keep these two-state exterior lights distinct from controls such as the flight
# directors, for which the same sample sends mouse press/release flags.
# Keep the shared builder for the retained course, Mach and vertical-speed
# recipes. Their wire encodings are unchanged by the three-action YAML pilot.
# Preserve the existing catalogue order while the source is split across the
# retained builders and YAML. Check the entire group so no extra entry is lost.
# Live behavior currently uses 0 for ARM and 1 for OFF. The installed NG3
# header publishes this event but does not document its parameter polarity,
# so retain logical-state readback protection around this empirical mapping.
# PMDG's installed NG3 connection sample operates the FD control with a
# complete mouse click rather than direct 0/1 event parameters. Apply those FD
# semantics to both crew-side counterparts. The provider reads the current
# switch first, so each logical ON/OFF action is still deterministic: an
# already-satisfied target is a no-op, otherwise one click is sent and the
# requested boolean state must be confirmed.
# The installed PMDG behavior drives this three-detent switch through
# control 123. Values 12301 and 12302 move one detent toward the named
# endpoint. Repeating an endpoint direction is bounded by the switch.
# Strobe OFF selects STEADY when strobes are on. An already-OFF position
# switch stays OFF, so this command cannot unnecessarily turn navigation on.
# Cold-and-dark initial-power controls. These definitions are restricted to
# stable selector positions published by the installed NG3 ClientData struct.
# Spring-loaded source switches use reviewed ROTOR_BRAKE directions and must
# confirm their electrical outcome on both transfer buses.
# Installed 737-800 4.0.63 cockpit behavior: control 118, press=1/2 by click
# half, release=4. The XML does not name the direction; community presets
# against L:switch_118_73X (0 OFF, 50 ON, 100 START) show 11801 advances
# toward START and 11802 retreats toward OFF. Allow each advance to settle
# before the next input, then release at START. A transport ACK does not mean
# the switch has moved.
# The numeric #70087 DOWN payload was accepted without moving the lever live.
# GEAR_DOWN/UP moved the handle in ~1.4 s, ahead of ~9 s gear travel. Keep
# SDK handle confirmation and allow scheduling headroom, not a gear-travel wait.
# See docs/PMDG-737-GEAR-VALIDATION.md. OFF is a separate, unverified SDK recipe.
# PMDG NG3 publishes dedicated control-stand mouse targets for the DOWN and
# ARM detents. Use those exact targets instead of moving the continuous lever,
# and confirm the authoritative SPEEDBRAKE ARMED annunciator after each write.
# THIRD_PARTY_EVENT_ID_MIN + 6791 (DOWN)
# THIRD_PARTY_EVENT_ID_MIN + 6792 (ARM)
# PMDG publishes dedicated mouse targets for every normal 737 flap detent.
# The direct targets avoid long relative sequences. Confirm a fresh cockpit
# lever selection without waiting for the surfaces to finish travelling.

# Mapping source notes: pmdg-737/mcp-actions.yaml
# Existing PMDG NG3 direct-set SDK events, with logical inputs in cockpit units.
# See docs/PMDG-737-PROFILE-VALIDATION.md for the recorded 737-800BCF evidence.
# The provider still owns input checks, dispatch, locks, no-op detection and
# independent confirmation. These recipes neither retry nor enable a flight mode.
# IAS and the retained Mach recipe share one physical selector and lock.
# The normalized window is shared with Mach. Blank is unavailable;
# transport acceptance alone must not report successful target selection.
# Preserve the MCP's 100-foot increments; the read value is already feet.

# Mapping source notes: pmdg-737/fields.ts
# PMDG's installed 737 cockpit behavior uses a 0..300 position for
# these dimmers. Keep the public contract in whole percentages.
# PMDG's NG3 ClientData contract does not publish radio frequencies. These
# standard MSFS readbacks are used only for the PMDG radio UI and for
# confirming PMDG SDK knob/transfer events.
# PMDG's cockpit lever animation reads NGXFlapLever. The standard handle
# index lags selection while the surfaces travel; see PMDG-737-FLAPS-VALIDATION.md.
# Exact detents keep unknown/intermediate values from confirming a selection.

# Mapping source notes: pmdg-737/mcp-fields.yaml
# PMDG 737 MCP readback only. These paths come from the existing NG3 ClientData
# connector's normalized output, not raw SDK byte offsets or write recipes.
# See docs/PMDG-737-PROFILE-VALIDATION.md for the exact live-evidence limits.
# SDK IAS and Mach share one value. Preserve Mach decimals; the connector
# supplies null when the speed window is blank. Never substitute zero for it.
# The connector also guards a blank V/S window. A visible zero remains valid.
# Captain and first-officer courses are independent selectors.

# Shared source notes: pmdg-atc.ts
# These helper notes retain their stated aircraft and verification scope.
#  Shared simulator transponder state; PMDG's SDK does not publish the code.
# The SDK exposes a button, not the duration of the transmitted IDENT.

schemaVersion: 1
integration:
  id: pmdg-737
  aircraft:
    vendor: PMDG
    family: "737"
  trustedProfileKeys:
    - bundled/msfs/pmdg-737
    - bundled/msfs/pmdg-737-600
    - bundled/msfs/pmdg-737-700
    - bundled/msfs/pmdg-737-900
  presentation:
    templateId: pmdg-737
    cockpitLightingGroups:
      - actionId: lighting.cockpit.panels.set
        label: Panel backlighting
        fields:
          - lighting.overheadCircuitBreakerPercent
          - lighting.overheadPanelPercent
          - lighting.mainPanelCaptainPercent
          - lighting.mainPanelFirstOfficerPercent
      - actionId: lighting.cockpit.ambient.set
        label: Flood and background lighting
        fields:
          - lighting.backgroundPercent
          - lighting.afdsFloodPercent
          - lighting.pedestalFloodPercent
          - lighting.pedestalPanelPercent
      - actionId: lighting.cockpit.captainDisplays.set
        label: Captain and upper displays
        displays: true
        fields:
          - lighting.displayCaptainOutboardPercent
          - lighting.displayCaptainInboardPercent
          - lighting.displayCaptainMapPercent
          - lighting.displayUpperPercent
      - actionId: lighting.cockpit.firstOfficerDisplays.set
        label: First officer and lower displays
        displays: true
        fields:
          - lighting.displayFirstOfficerOutboardPercent
          - lighting.displayFirstOfficerInboardPercent
          - lighting.displayFirstOfficerMapPercent
          - lighting.displayLowerPercent
  fields:
    # Observed state: sources and decoders retain their original order.

    # aircraft
    aircraft.model:
      id: aircraft.model
      sources:
        - route:
            type: sdk
            adapter: clientdata-manifest
            path: aircraft.model
          decode:
            type: enum
            values:
              737-600: 737-600
              737-700: 737-700
              737-700 BW: 737-700 BW
              737-700 SSW: 737-700 SSW
              737-800: 737-800
              737-800 BW: 737-800 BW
              737-800 SSW: 737-800 SSW
              737-900: 737-900
              737-900 BW: 737-900 BW
              737-900 SSW: 737-900 SSW
              737-900ER BW: 737-900ER BW
              737-900ER SSW: 737-900ER SSW
              737-700 BDSF BW: 737-700 BDSF BW
              737-700 BDSF SSW: 737-700 BDSF SSW
              737-800 BDSF BW: 737-800 BDSF BW
              737-800 BDSF SSW: 737-800 BDSF SSW
              737-800 BCF BW: 737-800 BCF BW
              737-800 BCF SSW: 737-800 BCF SSW
              737-700 BBJ BW: 737-700 BBJ BW
              737-700 BBJ SSW: 737-700 BBJ SSW
              737-800 BBJ BW: 737-800 BBJ BW

    # mcp
    mcp.altitudeFt:
      id: mcp.altitudeFt
      sources:
        - route:
            type: sdk
            adapter: clientdata-manifest
            path: automation.ap.selected.altitudeFt
          decode:
            type: number
            precision: 0
    mcp.headingDeg:
      id: mcp.headingDeg
      sources:
        - route:
            type: sdk
            adapter: clientdata-manifest
            path: automation.ap.selected.headingDeg
          decode:
            type: number
            precision: 0
    mcp.speed:
      id: mcp.speed
      sources:
        - route:
            type: sdk
            adapter: clientdata-manifest
            path: automation.ap.selected.iasMach
          decode:
            type: number
            precision: 2
    mcp.verticalSpeedFpm:
      id: mcp.verticalSpeedFpm
      sources:
        - route:
            type: sdk
            adapter: clientdata-manifest
            path: automation.ap.selected.vsFpm
          decode:
            type: number
            precision: 0
    mcp.courseCaptainDeg:
      id: mcp.courseCaptainDeg
      sources:
        - route:
            type: sdk
            adapter: clientdata-manifest
            path: automation.ap.selected.courseLeftDeg
          decode:
            type: number
            precision: 0
    mcp.courseFirstOfficerDeg:

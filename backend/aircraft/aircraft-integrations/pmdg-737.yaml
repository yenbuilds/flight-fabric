          operations:
            - type: lvar
              name: L:CA_BACKGROUND_BRT_CONTROL
              unit: Number
              inputValue:
                source: input
                scale: 3
                round: nearest
            - type: lvar
              name: L:CA_AFDS_FLOOD_LIGHT_CONTROL
              unit: Number
              inputValue:
                source: input
                scale: 3
                round: nearest
            - type: lvar
              name: L:PED_FLOOD_LIGHT_CONTROL
              unit: Number
              inputValue:
                source: input
                scale: 3
                round: nearest
            - type: lvar
              name: L:PED_PANEL_LIGHT_CONTROL
              unit: Number
              inputValue:
                source: input
                scale: 3
                round: nearest
          readbacks:
            - fieldId: lighting.backgroundPercent
              expectedInput: true
              timeoutMs: 2500
            - fieldId: lighting.afdsFloodPercent
              expectedInput: true
              timeoutMs: 2500
            - fieldId: lighting.pedestalFloodPercent
